<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lorenz Chaos</title>
<style>
  :root {
    --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
    --text: #eef1ff; --dim: #98a1c8; --line: rgba(255, 255, 255, .09); --glass: rgba(12, 14, 28, .58);
    --accent: #6fb8ff; --accent2: #7d6bff;
  }
  html, body { margin: 0; height: 100%; background: #030307; color: var(--text); overflow: hidden;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .top { position: fixed; left: 0; right: 0; top: 0; padding: calc(var(--top) + 18px) 22px 0; pointer-events: none; }
  .brand { font-weight: 650; letter-spacing: .34em; font-size: 12.5px; text-transform: uppercase; opacity: .9; }
  .hint { color: var(--dim); font-size: 13px; margin-top: 6px; max-width: 30em; transition: opacity 1.2s; }
  .hint.gone { opacity: 0; }
  .badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 5px 10px; border-radius: 99px; font-size: 12.5px;
    background: rgba(70, 200, 140, .14); border: 1px solid rgba(90, 220, 160, .28); color: #b9f5d6; }
  .badge[hidden] { display: none; }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 16px 16px calc(var(--bottom) + 16px);
    transition: transform .35s cubic-bezier(.2, .8, .2, 1), opacity .25s; }
  .dock.away { transform: translateY(30px); opacity: 0; pointer-events: none; }
  .btn { border: 1px solid var(--line); border-radius: 18px; padding: 15px 18px; background: var(--glass);
    -webkit-backdrop-filter: blur(16px) saturate(1.3); backdrop-filter: blur(16px) saturate(1.3); }
  .btn:active { transform: scale(.98); }
  .primary { flex: 1; border: 0; font-weight: 650; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
    box-shadow: 0 10px 34px rgba(90, 120, 255, .38); }
  .icon { width: 52px; padding: 0; display: grid; place-items: center; }
  .icon svg { width: 22px; height: 22px; }

  .sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 74vh; overflow-y: auto; overscroll-behavior: contain;
    transform: translateY(105%); transition: transform .4s cubic-bezier(.2, .8, .2, 1);
    background: rgba(9, 11, 22, .8); -webkit-backdrop-filter: blur(22px) saturate(1.2); backdrop-filter: blur(22px) saturate(1.2);
    border-radius: 24px 24px 0 0; border-top: 1px solid var(--line); padding: 0 18px calc(var(--bottom) + 20px); }
  .sheet.open { transform: none; }
  .head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 16px 0 10px;
    margin: 0 -18px; padding-left: 18px; padding-right: 18px; background: rgb(11, 13, 25); }
  .head::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 14px; pointer-events: none;
    background: linear-gradient(rgb(11, 13, 25), rgba(11, 13, 25, 0)); }
  .head h2 { margin: 0; font-size: 18px; font-weight: 650; }
  .done { border: 0; background: none; color: var(--accent); font-weight: 650; padding: 8px 4px; }
  h3 { margin: 18px 0 6px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); font-weight: 600; }

  .row { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .lab { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .val { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 14px; white-space: nowrap; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; margin: 4px 0 0; background: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent) var(--p, 50%), rgba(255, 255, 255, .14) var(--p, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -9px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .5); }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .tog { position: relative; flex: none; width: 50px; height: 30px; border-radius: 99px; background: rgba(255, 255, 255, .16); border: 0; transition: background .2s; }
  .tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .tog[aria-checked=true] { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .tog[aria-checked=true]::after { transform: translateX(20px); }
  .seg { display: flex; gap: 6px; margin-top: 8px; }
  .seg button { flex: 1; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); border-radius: 12px; padding: 9px 6px; font-size: 14px; }
  .seg button[aria-pressed=true] { background: rgba(111, 184, 255, .18); border-color: rgba(111, 184, 255, .55); }
  .seg.grid { display: grid; grid-template-columns: repeat(3, 1fr); }
  .row[hidden] { display: none; }
  .hue input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(90deg, #ff3b3b, #ffd83b, #3bff6e, #3bf0ff, #3b5bff, #c43bff, #ff3b3b); }
  .sub { color: var(--dim); font-size: 12.5px; margin-top: 6px; }
  .pals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 6px 0 4px; }
  .pal { border: 1px solid var(--line); background: rgba(255, 255, 255, .04); border-radius: 16px; padding: 10px 6px 8px; display: grid; justify-items: center; gap: 7px; font-size: 13px; }
  .pal i { width: 40px; height: 40px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .15); }
  .pal[aria-pressed=true] { border-color: rgba(255, 255, 255, .55); background: rgba(255, 255, 255, .09); }
  .reset { width: 100%; margin-top: 18px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); border-radius: 14px; padding: 12px; color: var(--dim); }
  .note { color: var(--dim); font-size: 12.5px; margin: 14px 2px 0; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--bottom) + 96px); transform: translateX(-50%); padding: 10px 14px; border-radius: 12px;
    background: rgba(20, 22, 40, .92); border: 1px solid var(--line); font-size: 13.5px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 86vw; text-align: center; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<iframe id="wp" title="Aperçu du fond d'écran"></iframe>

<div class="top">
  <div class="brand">Lorenz Chaos</div>
  <div class="hint" id="hint">Fais tourner l'attracteur du doigt, puis tourne ou secoue le téléphone.</div>
  <div class="badge" id="badge" hidden>● Fond d'écran actif</div>
</div>

<div class="dock" id="dock">
  <button class="btn icon" id="openSheet" aria-label="Réglages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
  </button>
  <button class="btn primary" id="apply">Appliquer comme fond d'écran</button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="Réglages">
  <div class="head"><h2>Réglages</h2><button class="done" id="closeSheet">Terminé</button></div>
  <div id="controls"></div>
  <button class="reset" id="reset">Revenir aux réglages d'origine</button>
  <p class="note">Les changements s'appliquent tout de suite à l'aperçu et au fond d'écran.</p>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
const A = window.Android;                                  // pont vers l'appli (absent dans un navigateur)
const $ = id => document.getElementById(id);

const PALETTES = [
  ['Spectre', 'conic-gradient(#ff4d4d, #ffd24d, #4dff88, #4dc3ff, #9b4dff, #ff4dc4, #ff4d4d)'],
  ['Néon', 'linear-gradient(135deg, #00e5ff, #6f3bff 55%, #ff2bd6)'],
  ['Aurore', 'linear-gradient(135deg, #00ffa3, #00c2ff 50%, #8a5cff)'],
  ['Braise', 'linear-gradient(135deg, #ffd36b, #ff8a00 45%, #ff2a00)'],
  ['Glacier', 'linear-gradient(135deg, #e6fbff, #3fa9ff 50%, #6a5cff)'],
  ['Or', 'linear-gradient(135deg, #fff1c4, #ffcf5a 45%, #c9772b)'],
  ['Perso', ''],                                           // couleur choisie avec Teinte et Saturation
];
const pct = v => Math.round(v * 100) + ' %';
const pctOff = v => v === 0 ? 'aucun' : pct(v);
const xN = n => v => '×' + v.toFixed(n);
// mêmes réglages que dans Wallpaper Engine sur PC (mêmes noms, mêmes limites), plus ceux du téléphone
const SECTIONS = [
  ['Couleurs', [
    { k: 'palette', type: 'palette', def: 4 },
    { k: 'hue', label: 'Teinte', min: 0, max: 360, step: 1, def: 265, fmt: v => v + '°', when: v => v.palette === 6, cls: 'hue' },
    { k: 'sat', label: 'Saturation', min: 55, max: 100, step: 1, def: 100, fmt: v => v + ' %', when: v => v.palette === 6 },
    { k: 'hueSpeed', label: 'Défilement des couleurs', min: 0, max: 0.2, step: 0.005, def: 0.05, fmt: v => v === 0 ? 'arrêté' : v.toFixed(3) },
    { k: 'spread', label: 'Étalement de la palette', min: 0, max: 4, step: 0.05, def: 1, fmt: xN(2) },
  ]],
  ['Particules', [
    { k: 'count', label: 'Particules', min: 100, max: 3000, step: 50, def: 500, fmt: String },
    { k: 'trail', label: 'Longueur des traînées', min: 20, max: 400, step: 10, def: 140, fmt: String },
    { k: 'smooth', label: 'Lissage des courbes', min: 1, max: 8, step: 1, def: 3, fmt: String },
    { k: 'heads', label: 'Éclat des têtes', min: 0, max: 3, step: 0.05, def: 1, fmt: pct },
    { k: 'ribbon', label: 'Départ en ruban (comme l\'original)', type: 'bool', def: 0 },
  ]],
  ['Mouvement', [
    { k: 'speed', label: 'Vitesse des particules', min: 0.1, max: 3, step: 0.05, def: 0.8, fmt: xN(2) },
    { k: 'spdMode', label: 'Vitesse différente au centre et sur les bords', type: 'bool', def: 1 },
    { k: 'spdIn', label: 'Vitesse au centre', min: 0.1, max: 6, step: 0.1, def: 2, fmt: xN(1), when: v => !!v.spdMode },
    { k: 'spdOut', label: 'Vitesse sur les bords', min: 0.1, max: 6, step: 0.1, def: 0.5, fmt: xN(1), when: v => !!v.spdMode },
    { k: 'morph', label: 'Respiration de la forme', min: 0, max: 2, step: 0.05, def: 0, fmt: pctOff },
  ]],
  ['Caméra', [
    { k: 'autoRotate', label: 'Rotation automatique', min: -0.5, max: 0.5, step: 0.01, def: 0, fmt: v => v === 0 ? 'aucune' : (v > 0 ? '+' : '') + v.toFixed(2) },
    { k: 'sway', label: 'Balancement de la caméra', min: 0, max: 2, step: 0.05, def: 0, fmt: pctOff },
  ]],
  ['Lumière', [
    { k: 'brightness', label: 'Luminosité', min: 0.2, max: 3, step: 0.05, def: 1, fmt: pct },
    { k: 'bloom', label: 'Halo (bloom)', min: 0, max: 3, step: 0.05, def: 1, fmt: pct },
    { k: 'stars', label: 'Étoiles', min: 0, max: 3, step: 0.05, def: 1, fmt: pct },
    { k: 'nebula', label: 'Nébuleuse', min: 0, max: 3, step: 0.05, def: 1, fmt: pct },
  ]],
  ['Téléphone', [
    { k: 'touch', label: 'Rotation au doigt', min: 0, max: 2, step: 0.1, def: 1, fmt: v => v === 0 ? 'désactivée' : '×' + v.toFixed(1) },
    { k: 'tilt', label: 'Inertie quand on tourne le téléphone', min: 0, max: 2, step: 0.1, def: 1, fmt: v => v === 0 ? 'désactivée' : '×' + v.toFixed(1) },
    { k: 'tiltInv', label: 'Inertie inversée (suit le téléphone)', type: 'bool', def: 0 },
    { k: 'shake', label: 'Secouer pour disperser les particules', type: 'bool', def: 1 },
    { k: 'pan', label: 'Tourner en changeant de page', type: 'bool', def: 1 },
    { k: 'recenter', label: 'Retour à la vue de départ', min: 0, max: 30, step: 1, def: 8, fmt: v => v === 0 ? 'jamais' : 'après ' + v + ' s' },
  ]],
  ['Performances', [
    { k: 'profile', label: 'Qualité', type: 'choice', def: 0, grid: true, sub: ' ',
      options: [[0, 'Auto'], [1, 'Économe'], [2, 'Équilibrée'], [3, 'Élevée'], [4, 'Maximale'], [5, 'Perso']] },
    { k: 'fps', label: 'Images par seconde au repos', type: 'choice', def: 30, options: [[24, '24'], [30, '30'], [60, '60']],
      sub: 'Moins il y en a, moins la batterie s\'use.' },
    { k: 'boost', label: 'Plus fluide quand on le touche ou qu\'on bouge le téléphone', type: 'bool', def: 1 },
    { k: 'quality', label: 'Résolution', type: 'choice', def: 0, options: [[0, 'Adaptée'], [1, 'Toujours maximale']],
      sub: 'Adaptée : elle baisse seulement si le téléphone n\'arrive pas à suivre.' },
    { k: 'aa', label: 'Anticrénelage', type: 'choice', def: 1, options: [[1, 'Analytique'], [4, 'MSAA 4×'], [2, 'MSAA 2×'], [0, 'Aucun']],
      sub: 'Analytique : net et léger, recommandé. MSAA : plus lourd.' },
  ]],
];
const ALL = SECTIONS.flatMap(s => s[1]);
const DEF = Object.fromEntries(ALL.map(c => [c.k, c.def]));

// couleur perso : teinte et saturation -> couleur (même calcul que la page du fond d'écran)
function hsl2rgb(h, s, l) {
  const f = n => { const k = (n + h * 12) % 12; return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
}
const customRGB = v => hsl2rgb(v.hue / 360, v.sat / 100, 0.55);
const customHex = v => customRGB(v).map(c => Math.round(c * 255).toString(16).padStart(2, '0')).join('');
const customCss = v => {
  const h = v.hue, s = v.sat;
  return `linear-gradient(135deg, hsl(${h} ${s * 0.5}% 85%), hsl(${h} ${s}% 55%) 45%, hsl(${(h + 340) % 360} ${s}% 45%))`;
};

// réglages enregistrés (appli) ou mémorisés par le navigateur (essais)
function load() {
  let q = '';
  try { q = A ? A.query() : (localStorage.getItem('lorenz-q') || ''); } catch (e) {}
  const v = { ...DEF };
  for (const [k, x] of new URLSearchParams(q)) if (Object.prototype.hasOwnProperty.call(DEF, k) && x !== '' && isFinite(+x)) v[k] = +x;
  return v;
}
const val = load();
let device = '';                                           // mémoire, cœurs, fréquence de l'écran, économie d'énergie
try { device = A && A.device ? A.device() : ''; } catch (e) {}
const query = () => ALL.map(c => c.k + '=' + val[c.k]).join('&') + '&color=' + customHex(val);
let saveT = 0;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { A ? A.save(query()) : localStorage.setItem('lorenz-q', query()); } catch (e) {} }, 300);
}

// aperçu : la vraie page du fond d'écran, pilotée par messages
const frame = $('wp');
frame.src = 'index.html?mobile=1' + (A ? '&native=1' : '') + (device ? '&' + device : '') + '&' + query() + (/[?&]debug\b/.test(location.search) ? '&debug=1' : '');
const post = msg => { try { frame.contentWindow.postMessage(msg, '*'); } catch (e) {} };
const push = k => post({ lorenzProps: k === 'hue' || k === 'sat' ? { schemecolor: { value: customRGB(val).join(' ') } } : { [k]: { value: val[k] } } });
// capteurs envoyés par l'appli -> aperçu
const fwd = name => (...a) => post({ lorenzPhone: [name, ...a] });
window.__phone = { rot: fwd('rot'), shake: fwd('shake') };

// construction des réglages
const ui = {};
const box = $('controls');
for (const [title, list] of SECTIONS) {
  const h = document.createElement('h3'); h.textContent = title; box.appendChild(h);
  for (const c of list) {
    const row = document.createElement('div'); row.className = 'row'; box.appendChild(row);
    if (c.type === 'palette') {
      const g = document.createElement('div'); g.className = 'pals'; row.appendChild(g);
      ui[c.k] = PALETTES.map(([name, css], i) => {
        const b = document.createElement('button'); b.className = 'pal';
        b.innerHTML = '<i></i><span></span>'; b.firstChild.style.background = css; b.lastChild.textContent = name;
        b.onclick = () => set(c.k, i); g.appendChild(b); return b;
      });
    } else if (c.type === 'bool') {
      row.innerHTML = '<div class="switch"><span></span><button class="tog" role="switch"></button></div>';
      row.querySelector('span').textContent = c.label;
      const t = row.querySelector('.tog'); t.setAttribute('aria-label', c.label);
      t.onclick = () => set(c.k, val[c.k] ? 0 : 1); ui[c.k] = t;
    } else if (c.type === 'choice') {
      row.innerHTML = '<div class="lab"><span></span></div><div class="seg' + (c.grid ? ' grid' : '') + '"></div>';
      row.querySelector('span').textContent = c.label;
      ui[c.k] = c.options.map(([v, name]) => {
        const b = document.createElement('button'); b.textContent = name; b.onclick = () => set(c.k, v);
        row.querySelector('.seg').appendChild(b); return [v, b];
      });
      if (c.sub) { const p = document.createElement('div'); p.className = 'sub'; p.textContent = c.sub; row.appendChild(p); c.subEl = p; }
    } else {
      row.innerHTML = '<div class="lab"><span></span><span class="val"></span></div><input type="range">';
      row.querySelector('span').textContent = c.label;
      const r = row.querySelector('input'); r.min = c.min; r.max = c.max; r.step = c.step; r.setAttribute('aria-label', c.label);
      r.oninput = () => set(c.k, +r.value);
      ui[c.k] = { r, out: row.querySelector('.val') };
    }
    if (c.cls) row.classList.add(c.cls);
    c.row = row;
  }
}
function render() {
  for (const c of ALL) {
    const v = val[c.k], u = ui[c.k];
    if (c.type === 'palette') {
      u.forEach((b, i) => b.setAttribute('aria-pressed', i === v));
      u[6].firstChild.style.background = customCss(val);   // la pastille « Perso » montre la couleur choisie
    }
    else if (c.type === 'bool') u.setAttribute('aria-checked', !!v);
    else if (c.type === 'choice') u.forEach(([x, b]) => b.setAttribute('aria-pressed', x === v));
    else {
      if (+u.r.value !== v) u.r.value = v;
      u.r.style.setProperty('--p', ((v - c.min) / (c.max - c.min) * 100).toFixed(1) + '%');
      u.out.textContent = c.fmt(v);
    }
    if (c.when) c.row.hidden = !c.when(val);           // comme les réglages conditionnels de Wallpaper Engine
  }
}
const PERF = ['count', 'trail', 'smooth', 'fps', 'quality', 'aa'];
function set(k, v) {
  if (val[k] === v) return;
  if (PERF.includes(k) && val.profile !== 5) { val.profile = 5; push('profile'); }   // réglage à la main : profil « Perso »
  val[k] = v; render(); describe(); push(k); save();
}
// ce que l'aperçu a détecté et appliqué (profil automatique ou choisi)
const NAMES = ['', 'Économe', 'Équilibrée', 'Élevée', 'Maximale'];
let detected = null;
function describe() {
  const c = ALL.find(x => x.k === 'profile');
  if (!c.subEl) return;
  const d = detected;
  if (val.profile === 5) c.subEl.textContent = 'Tes propres réglages ci-dessous.';
  else if (val.profile >= 1) c.subEl.textContent = 'Profil ' + NAMES[val.profile] + '. Modifier un réglage ci-dessous passe en Perso.';
  else if (!d) c.subEl.textContent = 'Choisie selon ton téléphone.';
  else {
    const gpu = String(d.gpu || '').replace(/\((TM|R)\)/g, '').replace(/^ANGLE \(([^,]+), ([^,]+),.*$/, '$2').replace(/\s+/g, ' ').trim();
    let t = 'Ton téléphone' + (gpu ? ' (' + gpu + (d.mem ? ', ' + d.mem + ' Go' : '') + ')' : '') + ' : ' + NAMES[d.tier] + '.';
    if (d.why && d.why.length) t += ' Limitée par : ' + d.why.join(', ') + '.';
    if (d.lowered) t += ' Abaissée à ' + NAMES[d.applied] + ' pour rester fluide.';
    c.subEl.textContent = t;
  }
}
addEventListener('message', e => {
  const q = e.data && e.data.lorenzQuality;
  if (!q || typeof q !== 'object') return;
  detected = q;
  if (val.profile !== 5 && q.values) for (const k of PERF) if (k in q.values) val[k] = +q.values[k];   // valeurs du profil
  render(); describe();
});
render(); describe();

// panneau des réglages
const sheet = $('sheet'), dock = $('dock');
function openSheet() { sheet.classList.add('open'); dock.classList.add('away'); try { A && A.sheet(true); } catch (e) {} }
window.closeSheet = () => { sheet.classList.remove('open'); dock.classList.remove('away'); try { A && A.sheet(false); } catch (e) {} };
$('openSheet').onclick = openSheet;
$('closeSheet').onclick = window.closeSheet;
$('reset').onclick = () => { for (const c of ALL) if (val[c.k] !== c.def) { val[c.k] = c.def; push(c.k); } render(); save(); };

// appliquer
const toast = msg => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3200); };
$('apply').onclick = () => {
  save();
  if (A) A.apply(); else toast('Dans l\'appli Android, ce bouton ouvre l\'écran pour définir le fond d\'écran.');
};
function refreshActive() {
  let on = false;
