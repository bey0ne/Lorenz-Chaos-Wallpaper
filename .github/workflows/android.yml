name: Appli Android

on:
  push:
    paths: [ 'index.html', 'android/**', '.github/workflows/android.yml' ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compiler l'APK
        run: gradle -p android :app:assembleRelease --stacktrace

      - name: Nommer le fichier
        run: cp android/app/build/outputs/apk/release/app-release.apk lorenz-chaos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lorenz-chaos-apk
          path: lorenz-chaos.apk

      # lien de téléchargement fixe, remplacé à chaque compilation :
      # https://github.com/<dépôt>/releases/download/android/lorenz-chaos.apk
      - name: Mettre l'APK en téléchargement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create android lorenz-chaos.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Lorenz Chaos pour Android" \
            --notes "Fond d'écran animé pour Android (même rendu que la version Wallpaper Engine). Télécharger lorenz-chaos.apk sur le téléphone, l'ouvrir pour l'installer, puis appuyer sur « Appliquer comme fond d'écran ». Compilé automatiquement à partir du commit ${GITHUB_SHA::7}."
