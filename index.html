<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lorenz Chaos</title>
<style>
  html, body { margin: 0; height: 100%; background: #030307; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #8a86a6; font: 15px/1.5 system-ui, sans-serif; text-align: center; padding: 2em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ *
 *  Réglages (modifiables depuis Wallpaper Engine, voir project.json)  *
 * ------------------------------------------------------------------ */
const cfg = {
  count: 900,          // nombre de particules
  trail: 170,          // longueur des traînées (en ticks de 1/60 s)
  speed: 0.8,          // vitesse de simulation
  palette: 0,          // 0 spectre, 1 néon, 2 aurore, 3 braise, 4 glacier, 5 or, 6 perso
  custom: [0.48, 0.18, 1.0],
  hueSpeed: 0.05,      // défilement des couleurs
  spread: 1.0,         // étalement de la palette entre particules
  bloom: 1.0,
  brightness: 1.0,
  heads: 1.0,          // éclat des têtes de particules
  autoRotate: 0,       // rad/s
  smooth: 4,           // lissage des courbes (subdivisions par segment, calculées sur le GPU)
  sway: 0,             // balancement de la caméra (tangage, roulis, travelling)
  morph: 0,            // respiration de la forme (paramètres de Lorenz qui varient)
  mouse: true,
  mouseStrength: 1.0,
  stars: 1.0,
  nebula: 1.0,
  audio: true,
  audioGain: 1.0,
  ribbon: false,       // départ en ruban serré (comme l'original) au lieu d'un attracteur déjà rempli
  fps: 0,
  quality: 0,          // 0 auto (résolution réduite seulement si le GPU ne tient pas la cadence), 1 toujours pleine résolution
  spdMode: true,       // vitesses choisies au centre et sur les bords (false = vitesses naturelles de Lorenz)
  spdIn: 2.0,          // vitesse visible au centre (passage d'une aile à l'autre)
  spdOut: 0.5,         // vitesse visible sur les bords extérieurs
  roll: -1,            // rotation de l'image (rad), -1 = auto : 90° sur écran vertical
  zoom: 0,             // recul de la caméra, 0 = auto (s'adapte aux écrans verticaux)
  aa: 1,               // anticrénelage des traînées : 1 analytique (léger), 4 ou 2 MSAA, 0 aucun
  mobile: -1,          // -1 auto (écran tactile hors Wallpaper Engine), 0 version PC, 1 version téléphone
  // version téléphone
  touch: 1,            // sensibilité du doigt (0 = ignoré)
  tilt: 1,             // force de l'inertie quand on tourne le téléphone (0 = gyroscope ignoré)
  tiltInv: false,      // inertie inversée (l'attracteur tourne avec le téléphone, en plus)
  shake: true,         // secouer le téléphone disperse les particules
  recenter: 8,         // secondes sans toucher avant le retour à la vue de départ (0 = jamais)
  pan: true,           // légère rotation quand on change de page sur l'écran d'accueil
  native: false,       // capteurs fournis par l'appli Android (window.__phone) au lieu du navigateur
};

const qs = new URLSearchParams(location.search);
const has = k => Object.prototype.hasOwnProperty.call(cfg, k) && typeof cfg[k] !== 'object';
for (const [k, v] of qs) if (has(k)) cfg[k] = typeof cfg[k] === 'boolean' ? v === '1' || v === 'true' : +v;
const hexQ = qs.get('color') || '';                     // couleur perso (palette 6) : color=7a2eff
if (/^[0-9a-f]{6}$/i.test(hexQ)) cfg.custom = [0, 2, 4].map(i => parseInt(hexQ.slice(i, i + 2), 16) / 255);

// Wallpaper Engine injecte ses fonctions avant le chargement de la page
const IN_WE = typeof window.wallpaperRegisterAudioListener === 'function';
const MOBILE = cfg.mobile === 1 || (cfg.mobile === -1 && !IN_WE && !!(window.matchMedia && matchMedia('(pointer: coarse)').matches));
// réglages par défaut plus légers sur téléphone (batterie), sauf s'ils sont donnés dans l'adresse
if (MOBILE) for (const [k, v] of Object.entries({ count: 600, trail: 150, smooth: 3, fps: 30, palette: 4 })) if (!qs.has(k)) cfg[k] = v;
const DEBUG = qs.has('debug');
let applyMobile = () => {};                            // remplacé par le module téléphone plus bas

/* ---------------------------- WebGL setup ---------------------------- */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
const fail = msg => { const e = document.getElementById('err'); e.textContent = msg; e.style.display = 'grid'; };
if (!gl) { fail('Ce fond d\'écran a besoin de WebGL 2.'); return; }

// cibles HDR (RGBA16F) : EXT_color_buffer_float sur PC, souvent seulement EXT_color_buffer_half_float sur téléphone
const HDR = (!!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float')) && (() => {
  const t = gl.createTexture(), fb = gl.createFramebuffer();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, 4, 4, 0, gl.RGBA, gl.HALF_FLOAT, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(fb); gl.deleteTexture(t);
  return ok;
})();
const IFMT = HDR ? gl.RGBA16F : gl.RGBA8;
const ITYPE = HDR ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
const MAX_TEX = gl.getParameter(gl.MAX_TEXTURE_SIZE);
const MAX_SAMPLES = gl.getParameter(gl.MAX_SAMPLES) || 0;
const samples = () => cfg.aa > 1 ? Math.min(cfg.aa | 0, MAX_SAMPLES) : 0;

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name);
  }
  return { p, u };
}

/* ------------------------------ Shaders ------------------------------ */
const COMMON = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform sampler2D uHist;
uniform int uL, uHead, uFilled;
uniform mat3 uRot;
uniform float uZc, uN, uDist, uFocal, uAspect, uScale, uTime, uHueSpeed, uSpread, uRainbow, uIntensity;
uniform vec3 uPal[4];

vec3 palette(float t) {
  if (uRainbow > 0.5) {
    vec3 k = clamp(abs(mod(fract(t) * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
    return pow(mix(vec3(1.0), k, 0.97), vec3(2.2));
  }
  t = fract(t) * 4.0;
  int i = int(t) % 4;
  return mix(uPal[i], uPal[(i + 1) % 4], smoothstep(0.0, 1.0, fract(t)));
}
vec4 project(vec3 s, out float depth) {
  vec3 w = vec3(s.x, s.y, s.z - uZc) * uScale;
  w = uRot * w;
  float zc = uDist - w.z;
  depth = clamp((zc - uDist + 1.25) / 2.5, 0.0, 1.0);
  return vec4(w.x * uFocal / uAspect, w.y * uFocal, 0.0, zc);
}
// teinte cohérente dans l'espace (les zones gardent une couleur franche) + décalage par particule
float hueAt(vec3 s, int p) { return s.x / 46.0 + s.z / 90.0 + float(p) / uN * uSpread * 0.18 + uTime * uHueSpeed; }
vec4 fetch(int p, int k) { return texelFetch(uHist, ivec2(p, (uHead - k + uL * 8) % uL), 0); }
`;

const LINE_VS = COMMON + `
out vec3 vCol;
out float vD;
uniform int uSub, uRibbon;
uniform vec2 uRes;
uniform float uWarpGlow;
void main() {
  // une instance = une particule, dessinée d'un seul tenant : chaque point de la courbe est calculé une seule fois
  // chaque intervalle entre deux points d'historique est découpé en uSub morceaux (spline Catmull-Rom)
  // uRibbon = 1 : ruban de 2 px avec couverture analytique (anticrénelage exact, sans MSAA)
  int p = gl_InstanceID;
  vD = 0.0;
  if (uFilled < 2) { gl_Position = vec4(0.0, 0.0, -2.0, 1.0); vCol = vec3(0.0); return; }
  int v = uRibbon == 1 ? gl_VertexID >> 1 : gl_VertexID;
  float side = float(gl_VertexID & 1) * 2.0 - 1.0;
  int vMax = (uFilled - 1) * uSub;
  bool hidden = v > vMax;                 // au-delà de l'historique rempli : segment dégénéré et noir
  v = min(v, vMax);
  int kSeg = min(v / uSub, uFilled - 2);
  float u = float(v - kSeg * uSub) / float(uSub);
  vec4 p0 = fetch(p, max(kSeg - 1, 0));
  vec4 p1 = fetch(p, kSeg);
  vec4 p2 = fetch(p, kSeg + 1);
  vec4 p3 = fetch(p, min(kSeg + 2, uFilled - 1));
  float u2 = u * u, u3 = u2 * u;
  vec4 s = 0.5 * (2.0 * p1 + (p2 - p0) * u + (2.0 * p0 - 5.0 * p1 + 4.0 * p2 - p3) * u2 + (3.0 * p1 - p0 - 3.0 * p2 + p3) * u3);
  float d; gl_Position = project(s.xyz, d);
  if (uRibbon == 1 && !hidden) {
    // direction de la courbe à l'écran (dérivée exacte de la spline), puis décalage perpendiculaire de 1 px
    vec3 ds = 0.5 * ((p2 - p0).xyz + 2.0 * u * (2.0 * p0 - 5.0 * p1 + 4.0 * p2 - p3).xyz + 3.0 * u2 * (3.0 * p1 - p0 - 3.0 * p2 + p3).xyz);
    float d2; vec4 q = project(s.xyz + ds * 0.05, d2);
    vec2 dir = (q.xy / q.w - gl_Position.xy / gl_Position.w) * uRes;
    float l = length(dir);
    vec2 n = l > 1e-6 ? vec2(-dir.y, dir.x) / l : vec2(0.0, 1.0);
    gl_Position.xy += n * side * (2.0 / uRes) * gl_Position.w;
    vD = side;
  }
  float age = (float(kSeg) + u) / float(uL - 1);
  float fade = pow(1.0 - age, 1.8);
  vec3 c = palette(hueAt(s.xyz, p) + age * 0.08);
  c = mix(c, vec3(1.0), smoothstep(150.0, 280.0, s.w) * 0.2);   // zones rapides = plus blanches
  float glow = mix(1.0, mix(0.6, 1.5, smoothstep(40.0, 320.0, s.w)), uWarpGlow);   // rapide = plus lumineux
  vCol = hidden ? vec3(0.0) : c * fade * mix(1.5, 0.3, d) * uIntensity * glow;
}`;

const LINE_FS = `#version 300 es
precision highp float;
in vec3 vCol; in float vD; out vec4 o;
// couverture d'une ligne de 1 px filtrée par le pixel : triangle de demi-largeur 1 px, intégrale = 1
void main() { o = vec4(vCol * max(0.0, 1.0 - abs(vD)), 1.0); }`;

const HEAD_VS = COMMON + `
uniform float uHeadSize, uHeadI;
out vec3 vCol;
void main() {
  int p = gl_VertexID;
  vec4 s = fetch(p, 0);
  float d; gl_Position = project(s.xyz, d);
  gl_PointSize = uFilled > 1 ? uHeadSize * mix(1.7, 0.5, d) : 0.0;
  vec3 c = palette(hueAt(s.xyz, p));
  vCol = mix(c, vec3(1.0), 0.45) * mix(1.6, 0.25, d) * uHeadI;
}`;

const HEAD_FS = `#version 300 es
precision highp float;
in vec3 vCol; out vec4 o;
void main() {
  vec2 q = gl_PointCoord * 2.0 - 1.0;
  float r = dot(q, q);
  o = vec4(vCol * (exp(-r * 6.0) - exp(-6.0)), 1.0);
}`;

const QUAD_VS = `#version 300 es
out vec2 vUv;
void main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); vUv = p; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

const DOWN_FS = `#version 300 es
precision mediump float;
uniform mediump sampler2D uTex; uniform highp vec2 uTexel;
in highp vec2 vUv; out vec4 o;
void main() {
  vec3 s = texture(uTex, vUv).rgb * 4.0;
  s += texture(uTex, vUv - uTexel).rgb;
  s += texture(uTex, vUv + uTexel).rgb;
  s += texture(uTex, vUv + vec2(uTexel.x, -uTexel.y)).rgb;
  s += texture(uTex, vUv - vec2(uTexel.x, -uTexel.y)).rgb;
  o = vec4(s / 8.0, 1.0);
}`;

const UP_FS = `#version 300 es
precision mediump float;
uniform mediump sampler2D uTex; uniform highp vec2 uTexel;
in highp vec2 vUv; out vec4 o;
void main() {
  highp vec2 t = uTexel;
  vec3 s = texture(uTex, vUv + vec2(-2.0 * t.x, 0.0)).rgb;
  s += texture(uTex, vUv + vec2( 2.0 * t.x, 0.0)).rgb;
  s += texture(uTex, vUv + vec2(0.0, -2.0 * t.y)).rgb;
  s += texture(uTex, vUv + vec2(0.0,  2.0 * t.y)).rgb;
  s += texture(uTex, vUv + vec2(-t.x,  t.y)).rgb * 2.0;
  s += texture(uTex, vUv + vec2( t.x,  t.y)).rgb * 2.0;
  s += texture(uTex, vUv + vec2(-t.x, -t.y)).rgb * 2.0;
  s += texture(uTex, vUv + vec2( t.x, -t.y)).rgb * 2.0;
  o = vec4(s / 12.0, 1.0);
}`;

const COMP_FS = `#version 300 es
precision highp float;
uniform sampler2D uScene, uBloom, uNeb;
uniform vec2 uRes, uCam;
uniform vec3 uTint;
uniform float uTime, uBloomI, uExposure, uStars, uNebula, uPulse;
in vec2 vUv; out vec4 o;

float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + 1.0), f.x), f.y);
}
// une couche d'étoiles : au plus une étoile par cellule, ronde, de couleur et taille variables
vec3 stars(vec2 fc, float cell, float density, float size, float seed, float spikes) {
  vec2 g = fc / cell, id = floor(g), f = fract(g);
  float h = hash(id + seed);
  if (h > density) return vec3(0.0);
  vec2 c = 0.3 + 0.4 * vec2(hash(id + seed + 1.7), hash(id + seed + 3.1));
  vec2 v = (f - c) * cell;
  float h2 = hash(id + seed + 5.3);
  float rad = size * (0.55 + h2);
  float a = exp(-dot(v, v) / (rad * rad));
  a += spikes * (exp(-abs(v.y) * 1.4) * exp(-abs(v.x) / (rad * 7.0)) + exp(-abs(v.x) * 1.4) * exp(-abs(v.y) / (rad * 7.0))) * 0.35;
  a += spikes * exp(-length(v) / (rad * 3.5)) * 0.25;
  float tw = 0.7 + 0.3 * sin(uTime * (0.4 + h2 * 2.2) + h * 60.0);
  vec3 tc = mix(vec3(1.0, 0.76, 0.55), vec3(0.62, 0.76, 1.0), hash(id + seed + 8.8));
  return mix(vec3(1.0), tc, 0.6) * a * tw * (0.35 + h2);
}
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }

void main() {
  vec2 uv = vUv;
  vec2 p = (uv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
  float r = length(p);

  // fond : abîme indigo + nébuleuse lente teintée par la palette
  vec3 bg = mix(vec3(0.0032, 0.0026, 0.0075), vec3(0.0003, 0.0003, 0.0007), smoothstep(0.0, 0.95, r));
  vec4 nb = texture(uNeb, uv);
  bg += nb.rgb * (1.0 + uPulse * 0.6);

  // étoiles en trois plans de profondeur : plus elles sont proches, plus elles bougent avec la caméra
  vec2 fc = gl_FragCoord.xy * (1080.0 / min(uRes.x, uRes.y));
  vec3 st = stars(fc + uCam * 25.0, 6.0, 0.05 + nb.a * 0.12, 0.55, 0.0, 0.0) * (0.22 + nb.a * 0.3);
  st += stars(fc + uCam * 60.0, 26.0, 0.14, 0.85, 17.0, 0.0) * 0.45;
  st += stars(fc + uCam * 120.0, 150.0, 0.2, 1.25, 41.0, 1.0) * 0.8;
  bg += st * 0.12 * uStars;

  // lumière : scène HDR + bloom avec aberration chromatique sur les bords
  vec2 ca = (uv - 0.5) * 0.006;
  vec3 bl = vec3(texture(uBloom, uv + ca).r, texture(uBloom, uv).g, texture(uBloom, uv - ca).b);
  vec3 hdr = texture(uScene, uv).rgb + bl * uBloomI;
  vec3 col = aces(hdr * uExposure) + bg;

  col *= mix(1.0, smoothstep(1.3, 0.2, r), 0.6);
  col = pow(col, vec3(1.0 / 2.2));
  col += (hash(gl_FragCoord.xy + fract(uTime * 7.3) * 113.0) - 0.5) * (2.5 / 255.0);
  o = vec4(col, 1.0);
}`;

const NEB_FS = `#version 300 es
precision highp float;
uniform vec2 uRes, uCam;
uniform vec3 uTint, uTint2;
uniform float uTime, uNebula;
in vec2 vUv; out vec4 o;
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + 1.0), f.x), f.y);
}
float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + 17.1; a *= 0.5; } return v; }
// couleur pleinement saturée, sans perte de teinte
vec3 sat(vec3 c) { c /= max(max(c.r, c.g), max(c.b, 1e-3)); return pow(c, vec3(1.8)); }
void main() {
  vec2 p = (vUv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
  vec2 np = p * 1.25 + uCam * vec2(0.06, 0.04);
  float t = uTime * 0.01;
  // nuages : bruit replié sur lui-même (domain warping) pour des volutes organiques
  vec2 q = vec2(fbm(np + vec2(0.0, t)), fbm(np + vec2(5.2, 1.3) - t));
  vec2 w = vec2(fbm(np + 3.0 * q + vec2(1.7, 9.2) + t * 0.7), fbm(np + 3.0 * q + vec2(8.3, 2.8) - t * 0.5));
  float f = fbm(np + 2.5 * w);
  float dens = smoothstep(0.42, 1.0, f);
  dens *= dens;
  vec3 col = mix(sat(uTint2), sat(uTint), smoothstep(0.35, 0.95, length(q)));
  col = mix(col, vec3(1.0, 0.9, 0.95), smoothstep(0.85, 1.1, f) * 0.15);
  float dust = smoothstep(0.42, 0.78, fbm(np * 2.6 + w * 1.5 + 11.0));
  vec3 neb = col * pow(dens, 1.5) * (1.0 - dust * 0.75);
  // bande galactique diagonale, ondulée, traversée par les mêmes poussières
  vec2 bd = normalize(vec2(1.0, 0.42));
  float bb = dot(p + uCam * 0.04, vec2(-bd.y, bd.x)) + (fbm(np * 1.7 + 4.0) - 0.5) * 0.3;
  float band = exp(-bb * bb * 8.0);
  neb += mix(sat(uTint), vec3(0.9, 0.85, 1.0), 0.35) * band * 0.3 * pow(fbm(np * 4.5 + 2.0), 2.0) * (1.0 - dust * 0.85);
  // halo derrière l'attracteur
  neb += sat(mix(uTint, uTint2, 0.5)) * exp(-dot(p, p) * 3.5) * 0.12;
  o = vec4(neb * 0.22 * uNebula, band);
}`;

let P_NEB, P_LINE, P_HEAD, P_DOWN, P_UP, P_COMP;
try {
  P_LINE = program(LINE_VS, LINE_FS);
  P_HEAD = program(HEAD_VS, HEAD_FS);
  P_DOWN = program(QUAD_VS, DOWN_FS);
  P_UP   = program(QUAD_VS, UP_FS);
  P_COMP = program(QUAD_VS, COMP_FS);
  P_NEB  = program(QUAD_VS, NEB_FS);
} catch (e) { fail('Erreur de shader : ' + e.message); console.error(e); return; }

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

/* --------------------------- Render targets --------------------------- */
function makeTex(w, h, ifmt, fmt, type, filter) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function makeTarget(w, h) {
  const t = makeTex(w, h, IFMT, gl.RGBA, ITYPE, gl.LINEAR);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { t, fb, w, h };
}
function freeTarget(r) { if (r) { gl.deleteTexture(r.t); gl.deleteFramebuffer(r.fb); } }

let neb = null, nebAge = 1e9, nebClear = false;
let W = 0, H = 0, scene = null, ms = null, levels = [];
let renderScale = 1, msaaNow = -1;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2) * renderScale;
  const w = Math.max(1, Math.round(innerWidth * dpr)), h = Math.max(1, Math.round(innerHeight * dpr));
  if (w === W && h === H && msaaNow === samples()) return;
  msaaNow = samples();
  W = canvas.width = w; H = canvas.height = h;

  freeTarget(scene); freeTarget(neb); levels.forEach(freeTarget);
  neb = makeTarget(Math.max(1, W >> 2), Math.max(1, H >> 2)); nebAge = 1e9; nebClear = false;
  if (ms) { gl.deleteRenderbuffer(ms.rb); gl.deleteFramebuffer(ms.fb); ms = null; }

  scene = makeTarget(W, H);
  const SAMPLES = samples();
  if (SAMPLES > 1) {
    const rb = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
    gl.renderbufferStorageMultisample(gl.RENDERBUFFER, SAMPLES, IFMT, W, H);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rb);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE) ms = { rb, fb };
    else { gl.deleteRenderbuffer(rb); gl.deleteFramebuffer(fb); }
  }
  levels = [];
  let lw = W, lh = H;
  for (let i = 0; i < 6 && lw > 8 && lh > 8; i++) {
    lw = Math.max(1, lw >> 1); lh = Math.max(1, lh >> 1);
    levels.push(makeTarget(lw, lh));
  }
}

/* ---------------------------- Simulation ---------------------------- */
let SIG = 10, RHO = 28;
const BET = 8 / 3, SUB = 3, TICK = 1 / 60;
let N = 0, L = 0, pos, col, histTex = null, head = 0, filled = 0;

function lorenzStep(x, y, z, h, out) {
  let dx = SIG * (y - x), dy = x * (RHO - z) - y, dz = x * y - BET * z;
  const mx = x + dx * h * 0.5, my = y + dy * h * 0.5, mz = z + dz * h * 0.5;
  dx = SIG * (my - mx); dy = mx * (RHO - mz) - my; dz = mx * my - BET * mz;
  out[0] = x + dx * h; out[1] = y + dy * h; out[2] = z + dz * h; out[3] = Math.sqrt(dx * dx + dy * dy + dz * dz);
}

function alloc() {
  N = Math.max(16, Math.min(cfg.count | 0, MAX_TEX));
  L = Math.max(8, Math.min(cfg.trail | 0, MAX_TEX));
  pos = new Float32Array(N * 3);
  col = new Float32Array(N * 4);
  const tmp = new Float64Array(4);
  if (cfg.ribbon) {
    for (let i = 0; i < N; i++) { pos[i * 3] = 0.1 + (i / N) * 1.2; pos[i * 3 + 1] = 0; pos[i * 3 + 2] = 20; }
  } else {
    // particules étalées le long d'une longue trajectoire, puis légèrement perturbées
    let x = 0.1, y = 0, z = 20;
    for (let s = 0; s < 3000; s++) { lorenzStep(x, y, z, 0.005, tmp); [x, y, z] = tmp; }
    for (let i = 0; i < N; i++) {
      for (let s = 0; s < 7; s++) { lorenzStep(x, y, z, 0.004, tmp); [x, y, z] = tmp; }
      pos[i * 3]     = x + (Math.random() - 0.5) * 0.6;
      pos[i * 3 + 1] = y + (Math.random() - 0.5) * 0.6;
      pos[i * 3 + 2] = z + (Math.random() - 0.5) * 0.6;
    }
  }
  if (histTex) gl.deleteTexture(histTex);
  histTex = makeTex(N, L, gl.RGBA32F, gl.RGBA, gl.FLOAT, gl.NEAREST);   // une ligne par instant : mise à jour contiguë
  head = 0; filled = 0;
}

const stepOut = new Float64Array(4);
/* Vitesses au centre / sur les bords : chaque particule avance plus ou moins vite selon sa distance au
   plan de symétrie (x = 0, le milieu de l'écran). Le système étant autonome, les trajectoires restent
   exactement les mêmes : seule la vitesse le long de la courbe change. PROFIL compense la physique de
   Lorenz (les bords y sont naturellement ~5x plus rapides) pour que les curseurs donnent la vitesse visible. */
const PROFIL = 1.68, VBASE = 2.0;
const smooth01 = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
/* Secousse (version téléphone) : les particules sont écartées puis rappelées comme par un élastique, avec un
   léger rebond. Seul l'affichage est décalé : la simulation, elle, reste exactement sur l'attracteur. */
const kick = { t: 9, a: 0 };
let kickDir = null;
const KW = 2 * Math.PI * 1.1, KT = 0.25, KN = 0.4725;    // rebond à ~1 Hz amorti en ~0,25 s (KN : pic ramené à 1)
function tick(boost) {
  const h = 0.0025 * cfg.speed * boost;
  const custom = cfg.spdMode;
  const lIn = Math.log(Math.max(0.05, cfg.spdIn)), lOut = Math.log(Math.max(0.05, cfg.spdOut));
  const kickOn = kick.t < 1.6 && kickDir !== null && kickDir.length === N * 3;
  let ka = 0, kv = 0;
  if (kickOn) {
    kick.t += TICK;
    const e = Math.exp(-kick.t / KT), s = Math.sin(KW * kick.t);
    ka = kick.a * e * s / KN;                                                    // écart
    kv = Math.abs(kick.a * e * (KW * Math.cos(KW * kick.t) - s / KT) / KN);     // sa vitesse : les particules lancées brillent
  }
  for (let i = 0; i < N; i++) {
    const j = i * 3;
    let x = pos[j], y = pos[j + 1], z = pos[j + 2], v = 0;
    let w = 1;
    if (custom) {
      const d = Math.abs(x) / 18;
      const target = Math.exp(lIn + (lOut - lIn) * smooth01(0.05, 1.0, d));
      w = Math.min(8, Math.max(0.03, VBASE * target * Math.exp(-PROFIL * d)));
    }
    const hw = h * w;
    for (let s = 0; s < SUB; s++) { lorenzStep(x, y, z, hw, stepOut); x = stepOut[0]; y = stepOut[1]; z = stepOut[2]; v = stepOut[3]; }
    if (!isFinite(x + y + z)) { x = Math.random() - 0.5; y = 0; z = 20; }
    pos[j] = x; pos[j + 1] = y; pos[j + 2] = z;
    const k = i * 4; col[k] = x; col[k + 1] = y; col[k + 2] = z; col[k + 3] = v * w;   // vitesse apparente (éclat des zones rapides)
    if (kickOn) { col[k] += kickDir[j] * ka; col[k + 1] += kickDir[j + 1] * ka; col[k + 2] += kickDir[j + 2] * ka; col[k + 3] += kv * 3; }
  }
  head = (head + 1) % L;
  filled = Math.min(filled + 1, L);
  gl.bindTexture(gl.TEXTURE_2D, histTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, head, N, 1, gl.RGBA, gl.FLOAT, col);
}

/* ------------------------------ Palettes ------------------------------ */
const hex = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16) / 255);
const PALETTES = [
  null,                                                   // spectre (HSL de l'original)
  ['#00e5ff', '#6f3bff', '#ff2bd6', '#2a7bff'],           // néon
  ['#00ffa3', '#00c2ff', '#8a5cff', '#ff4fd8'],           // aurore
  ['#ff2a00', '#ff8a00', '#ffd36b', '#ff2d6f'],           // braise
  ['#bff8ff', '#3fa9ff', '#6a5cff', '#e6fbff'],           // glacier
  ['#ffcf5a', '#ff9d2e', '#fff1c4', '#c9772b'],           // or
];
function hsl2rgb(h, s, l) {
  const f = n => { const k = (n + h * 12) % 12; return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
}
function rgb2hsl([r, g, b]) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  const h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h / 6, s, l];
}
let palRGB = new Float32Array(12), tint = [0.5, 0.3, 1], tint2 = [0.9, 0.3, 0.6];
function updatePalette() {
  let stops;
  if (cfg.palette === 0) {
    stops = [[1, 0.3, 0.3], [0.3, 1, 0.4], [0.3, 0.5, 1], [1, 0.3, 1]];
    tint = [0.35, 0.25, 0.9]; tint2 = [0.85, 0.25, 0.55];
  } else if (cfg.palette >= PALETTES.length) {
    const [h, s] = rgb2hsl(cfg.custom);
    const sat = Math.max(0.55, s);
    stops = [hsl2rgb(h, sat, 0.55), hsl2rgb((h + 0.07) % 1, sat, 0.68), hsl2rgb((h + 0.94) % 1, sat, 0.45), hsl2rgb(h, sat * 0.5, 0.85)];
  } else {
    stops = PALETTES[cfg.palette].map(hex);
  }
  stops.forEach((c, i) => c.forEach((v, j) => { palRGB[i * 3 + j] = Math.pow(v, 2.2); }));
  if (cfg.palette !== 0) {
    tint = [0, 1, 2].map(j => (stops[0][j] + stops[1][j]) * 0.5);
    tint2 = [0, 1, 2].map(j => (stops[2][j] + stops[3][j]) * 0.5);
  }
}

/* ---------------------------- Interaction ---------------------------- */
let mxT = 0, myT = 0.2, mx = 0, my = 0.2;           // 0.2 -> inclinaison de départ 0.4 rad, comme l'original
addEventListener('pointermove', e => {
  mxT = e.clientX / innerWidth * 2 - 1; myT = e.clientY / innerHeight * 2 - 1;
});
addEventListener('resize', resize);

let bassT = 0, bass = 0;
function onAudio(a) {
  if (!cfg.audio) { bassT = 0; return; }
  let s = 0; for (let i = 0; i < 6; i++) s += a[i] + a[i + 64];
  bassT = Math.min(1.5, (s / 12) * cfg.audioGain);
}
if (window.wallpaperRegisterAudioListener) window.wallpaperRegisterAudioListener(onAudio);

window.wallpaperPropertyListener = {
  applyUserProperties(p) {
    const num = ['spdIn', 'spdOut', 'count', 'trail', 'speed', 'hueSpeed', 'spread', 'bloom', 'brightness', 'heads', 'autoRotate', 'smooth', 'sway', 'morph', 'mouseStrength', 'stars', 'nebula', 'audioGain',
      'touch', 'tilt', 'recenter', 'fps'];                 // ces derniers ne viennent que de l'appli Android
    let realloc = false, pal = false;
    for (const k of num) if (p[k]) { const v = +p[k].value; if (k === 'count' || k === 'trail') realloc ||= v !== cfg[k]; cfg[k] = v; }
    for (const k of ['spdMode', 'mouse', 'audio', 'ribbon', 'tiltInv', 'shake', 'pan']) if (p[k]) { if (k === 'ribbon') realloc ||= !!p[k].value !== cfg.ribbon; cfg[k] = !!p[k].value; }
    if (p.quality) { cfg.quality = +p.quality.value; if (cfg.quality === 1 && renderScale !== 1) { renderScale = 1; resize(); } }
    if (p.aa) { cfg.aa = +p.aa.value; if (W) resize(); }
    if (p.palette) { cfg.palette = +p.palette.value; pal = true; }
    if (p.schemecolor) { cfg.custom = p.schemecolor.value.split(' ').map(Number); pal = true; }
    if (pal) updatePalette();
    if (realloc) alloc();
  },
  applyGeneralProperties(p) { if (p.fps !== undefined) cfg.fps = +p.fps; },
  setPaused(v) { setPause(!!v); },
};
let paused = false, rafId = 0;
function setPause(v) {
  if (v === paused) return;
  paused = v;
  if (paused) { cancelAnimationFrame(rafId); rafId = 0; }
  else if (!rafId) { prev = lastDraw = performance.now(); rafId = requestAnimationFrame(frame); }
}
document.addEventListener('visibilitychange', () => setPause(document.hidden));

/* ------------------------------- Rendu ------------------------------- */
function bindCommon(u, cam) {
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, histTex); gl.uniform1i(u.uHist, 0);
  gl.uniform1i(u.uL, L); gl.uniform1i(u.uHead, head); gl.uniform1i(u.uFilled, filled);
  gl.uniform1f(u.uN, N); gl.uniform1f(u.uZc, RHO - 3); gl.uniformMatrix3fv(u.uRot, false, cam.rot);
  gl.uniform1f(u.uDist, cam.dist);
  gl.uniform1f(u.uFocal, cam.focal); gl.uniform1f(u.uAspect, W / H); gl.uniform1f(u.uScale, 1 / 24);
  gl.uniform1f(u.uTime, cam.t); gl.uniform1f(u.uHueSpeed, cfg.hueSpeed); gl.uniform1f(u.uSpread, cfg.spread);
  gl.uniform1f(u.uRainbow, cfg.palette === 0 ? 1 : 0);
  gl.uniform3fv(u.uPal, palRGB);
}

const rotBuf = new Float32Array(9);
function rotation(yaw, pitch, roll) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch), cr = Math.cos(roll), sr = Math.sin(roll);
  const basis = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
  // même ordre que la version d'origine : inclinaison autour de X, puis rotation autour de Y
  basis.forEach(([x, y, z], c) => {
    [y, z] = [y * cp - z * sp, y * sp + z * cp];
    [x, z] = [x * cy + z * sy, -x * sy + z * cy];
    y = -y; z = -z;                                   // repère canvas (y vers le bas) -> WebGL
    [x, y] = [cr * x - sr * y, sr * x + cr * y];
    rotBuf[c * 3] = x; rotBuf[c * 3 + 1] = y; rotBuf[c * 3 + 2] = z;
  });
  return rotBuf;
}

/* -------------------------- Version téléphone -------------------------- *
 * Doigt     : on attrape l'attracteur et on le fait tourner, sa face avant suit le doigt. Lancé, il garde
 *             son élan puis ralentit (frottement), et revient seul à sa vue de départ après un moment.
 * Gyroscope : l'attracteur a de l'inertie, comme un objet suspendu à un ressort dans le téléphone : quand
 *             on tourne le téléphone, il reste un instant immobile dans l'espace, puis revient en place
 *             avec un léger rebond.
 * Secousse  : les particules sont projetées, puis l'attracteur les rattrape.
 * Pages     : légère rotation quand on change de page sur l'écran d'accueil, petit zoom au retour.
 * Dans l'appli Android, capteurs et doigt arrivent par window.__phone ; dans un navigateur, par les
 * événements habituels (pointer*, devicemotion). Repère de l'écran : x à droite, y en haut, z vers soi. */
const qMul = (a, b) => [
  a[0] * b[0] - a[1] * b[1] - a[2] * b[2] - a[3] * b[3],
  a[0] * b[1] + a[1] * b[0] + a[2] * b[3] - a[3] * b[2],
  a[0] * b[2] - a[1] * b[3] + a[2] * b[0] + a[3] * b[1],
  a[0] * b[3] + a[1] * b[2] - a[2] * b[1] + a[3] * b[0]];
function qRot(x, y, z) {                                    // vecteur rotation (axe × angle) -> quaternion [w, x, y, z]
  const a = Math.hypot(x, y, z);
  if (a < 1e-9) return [1, x / 2, y / 2, z / 2];
  const s = Math.sin(a / 2) / a;
  return [Math.cos(a / 2), x * s, y * s, z * s];
}
function qLog(q) {                                          // quaternion -> vecteur rotation (angle <= pi)
  const sg = q[0] < 0 ? -1 : 1, w = q[0] * sg, x = q[1] * sg, y = q[2] * sg, z = q[3] * sg;
  const s = Math.hypot(x, y, z), f = s < 1e-9 ? 2 : 2 * Math.atan2(s, w) / s;
  return [x * f, y * f, z * f];
}
const qNorm = q => { const n = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0] / n, q[1] / n, q[2] / n, q[3] / n]; };
const qConj = q => [q[0], -q[1], -q[2], -q[3]];
const qPow = (q, f) => { const r = qLog(q); return qRot(r[0] * f, r[1] * f, r[2] * f); };

const PH = {
  qT: [1, 0, 0, 0], wv: [0, 0, 0], drag: null, idle: 1e9,  // doigt : rotation, élan (rad/s), geste en cours, temps sans toucher
  r: [0, 0, 0], w: [0, 0, 0], gIn: [0, 0, 0],             // ressort du gyroscope : écart, vitesse, rotation reçue du téléphone
  off: 0, offT: 0, off0: null,                            // pages de l'écran d'accueil
  zoom: 0, zoomT: 0, wake: 0,                             // volet ou tiroir ouvert, retour sur l'écran d'accueil
  sx: 0, sy: 0, qPrev: null,                              // décalage du ciel (parallaxe des étoiles)
};
const RM = new Float32Array(9);

function touchStart(x, y, t) {
  PH.drag = { x, y, last: t, vx: 0, vy: 0, off: PH.offT, paged: false };
  PH.wv = [0, 0, 0]; PH.idle = 0;                         // poser le doigt arrête la rotation, comme sur un globe
}
function touchMove(x, y, t) {
  const d = PH.drag; if (!d || !(cfg.touch > 0)) return;
  const k = Math.PI * 0.6 * cfg.touch / Math.max(1, Math.min(innerWidth, innerHeight));   // un écran de large ≈ 110°
  const ax = (y - d.y) * k, ay = (x - d.x) * k, dt = Math.max(0.004, (t - d.last) / 1000);
  d.x = x; d.y = y; d.last = t; PH.idle = 0;
  PH.qT = qNorm(qMul(qRot(ax, ay, 0), PH.qT));             // doigt vers la droite : rotation autour de l'axe vertical
  const a = Math.min(1, dt / 0.05);                        // vitesse lissée sur ~50 ms, pour l'élan au lâcher
  d.vx += (ax / dt - d.vx) * a; d.vy += (ay / dt - d.vy) * a;
}
function touchEnd(t) {
  const d = PH.drag; if (!d) return;
  PH.drag = null; PH.idle = 0;
  if (t - d.last > 90 || d.paged || !(cfg.touch > 0)) return;   // doigt arrêté avant de lâcher, ou page changée : pas d'élan
  const m = Math.hypot(d.vx, d.vy), f = m > 10 ? 10 / m : 1;
  PH.wv = [d.vx * f, d.vy * f, 0];
}
function shake(m) {                                         // m : accélération du téléphone hors pesanteur (m/s²)
  if (!cfg.shake || !(m > 12) || kick.t < 1 || !N) return;  // une secousse à la fois (la précédente doit être retombée)
  const s = Math.min(1, Math.max(0.3, (m - 12) / 14)), zc = RHO - 3;
  if (!kickDir || kickDir.length !== N * 3) kickDir = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    // vers l'extérieur depuis le centre de l'attracteur, avec une bonne part de hasard
    const j = i * 3, x = pos[j], y = pos[j + 1], z = pos[j + 2] - zc, l = Math.hypot(x, y, z) || 1;
    const dx = x / l + (Math.random() - 0.5) * 1.4, dy = y / l + (Math.random() - 0.5) * 1.4, dz = z / l + (Math.random() - 0.5) * 1.4;
    const f = (0.4 + Math.random() * 1.2) / (Math.hypot(dx, dy, dz) || 1);
    kickDir[j] = dx * f; kickDir[j + 1] = dy * f; kickDir[j + 2] = dz * f;
  }
  kick.a = 10 * s; kick.t = 0;                              // écart maximal ~10 (l'attracteur fait ~50 de haut)
}

const phone = {
  rot(x, y, z) { PH.gIn[0] += +x || 0; PH.gIn[1] += +y || 0; PH.gIn[2] += +z || 0; },   // rotation du téléphone depuis l'appel précédent (rad)
  shake(m) { shake(+m); },
  touch(kind, x, y, t) { kind === 0 ? touchStart(+x, +y, +t) : kind === 1 ? touchMove(+x, +y, +t) : touchEnd(+t); },
  offset(x) {                                              // position dans les pages de l'écran d'accueil (0 à 1)
    x = +x; if (!isFinite(x)) return;
    if (PH.off0 === null) PH.off0 = x;                     // la page de départ garde la vue de départ
    const v = x - PH.off0;
    if (PH.drag && Math.abs(v - PH.drag.off) > 0.01) PH.drag.paged = true;
    PH.offT = v;
  },
  zoom(z) { PH.zoomT = Math.max(0, Math.min(1, +z || 0)); },
  wake() { PH.wake = 1; },
  pause(v) { setPause(!!v); },
};

applyMobile = (cam, dt) => {
  if (dt > 0) {
    PH.idle += dt;
    // élan du doigt : frottement visqueux + frottement sec, la rotation finit par s'arrêter net
    if (!PH.drag) {
      const m = Math.hypot(PH.wv[0], PH.wv[1], PH.wv[2]);
      if (m > 0) {
        PH.qT = qNorm(qMul(qRot(PH.wv[0] * dt, PH.wv[1] * dt, PH.wv[2] * dt), PH.qT));
        const f = Math.max(0, m * Math.exp(-dt / 0.9) - 0.35 * dt) / m;
        PH.wv = PH.wv.map(v => v * f);
        if (m > 0.05) PH.idle = 0;
      }
      if (cfg.recenter > 0 && PH.idle > cfg.recenter) PH.qT = qPow(PH.qT, Math.exp(-dt / 1.6));   // retour en douceur
    }
    // gyroscope : la rotation reçue est étalée sur ~40 ms (les capteurs n'arrivent pas au rythme des images).
    // L'attracteur (vitesse w) est relié au téléphone par un ressort amorti (~0,55 Hz, amortissement 0,65) :
    // il prend du retard quand le téléphone tourne, puis revient en place avec un léger rebond.
    const a = 1 - Math.exp(-dt / 0.04), inp = PH.gIn.map(v => v * a);
    for (let i = 0; i < 3; i++) PH.gIn[i] -= inp[i];
    const g = (cfg.tiltInv ? -1 : 1) * cfg.tilt, K = 12.25, C = 4.55, n = Math.ceil(dt * 120), h = dt / n;
    for (let s = 0; s < n; s++) for (let i = 0; i < 3; i++) {
      PH.r[i] += (PH.w[i] - g * inp[i] / dt) * h;          // écart = rotation de l'attracteur - rotation du téléphone
      PH.w[i] += (-K * PH.r[i] - C * PH.w[i]) * h;
    }
    const rm = Math.hypot(PH.r[0], PH.r[1], PH.r[2]);
    if (rm > 1.2) PH.r = PH.r.map(v => v * 1.2 / rm);
    PH.off += (PH.offT - PH.off) * (1 - Math.exp(-dt / 0.12));
    PH.zoom += (PH.zoomT - PH.zoom) * (1 - Math.exp(-dt / 0.1));
    PH.wake = Math.max(0, PH.wake - dt / 0.9);
  }
  cam.dist *= 1 + PH.zoom * 0.3 + PH.wake * PH.wake * 0.14;

  // rotations dans le repère de l'écran, appliquées après la vue de départ : M = R · M
  let q = qMul(qRot(PH.r[0], PH.r[1], PH.r[2]), PH.qT);
  if (cfg.pan) q = qMul(qRot(0, -PH.off * 0.8, 0), q);
  const [w, x, y, z] = q, M = cam.rot;
  RM[0] = 1 - 2 * (y * y + z * z); RM[1] = 2 * (x * y - w * z); RM[2] = 2 * (x * z + w * y);
  RM[3] = 2 * (x * y + w * z); RM[4] = 1 - 2 * (x * x + z * z); RM[5] = 2 * (y * z - w * x);
  RM[6] = 2 * (x * z - w * y); RM[7] = 2 * (y * z + w * x); RM[8] = 1 - 2 * (x * x + y * y);
  for (let c = 0; c < 3; c++) {
    const a0 = M[c * 3], a1 = M[c * 3 + 1], a2 = M[c * 3 + 2];
    for (let r = 0; r < 3; r++) M[c * 3 + r] = RM[r * 3] * a0 + RM[r * 3 + 1] * a1 + RM[r * 3 + 2] * a2;
  }
  // le ciel suit le mouvement, comme avec la souris sur PC (et revient doucement à sa place)
  if (PH.qPrev) { const d = qLog(qMul(q, qConj(PH.qPrev))); PH.sx -= d[1]; PH.sy += d[0]; }
  PH.qPrev = q;
  const e = Math.exp(-Math.max(0, dt) / 25); PH.sx *= e; PH.sy *= e;
  cam.yaw += PH.sx; cam.pitch += PH.sy;
};

if (MOBILE) {
  window.__phone = phone;
  // navigateur ou aperçu dans l'appli : doigt (ou souris) directement sur la page
  let pid = null, asked = false;
  addEventListener('pointerdown', e => {
    if (pid !== null) return;
    pid = e.pointerId; touchStart(e.clientX, e.clientY, e.timeStamp);
    if (!asked && !cfg.native) {                            // iPhone : l'accès aux capteurs se demande après un geste
      asked = true;
      try { if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function') DeviceMotionEvent.requestPermission().catch(() => {}); } catch (err) {}
    }
  });
  addEventListener('pointermove', e => { if (e.pointerId === pid) touchMove(e.clientX, e.clientY, e.timeStamp); });
  const up = e => { if (e.pointerId === pid) { pid = null; touchEnd(e.timeStamp); } };
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  if (!cfg.native) addEventListener('devicemotion', e => {
    let iv = e.interval || 16; if (iv < 1) iv *= 1000;      // en ms (certains navigateurs l'ont donné en secondes)
    const r = e.rotationRate;
    if (r && r.alpha !== null && r.beta !== null) {
      const f = Math.PI / 180 * iv / 1000;                  // degrés/s -> rad sur l'intervalle
      let x = (r.beta || 0) * f, y = (r.gamma || 0) * f;
      const ang = ((((screen.orientation ? screen.orientation.angle : window.orientation) || 0) % 360) + 360) % 360;
      if (ang === 90) [x, y] = [-y, x]; else if (ang === 180) [x, y] = [-x, -y]; else if (ang === 270) [x, y] = [y, -x];
      phone.rot(x, y, (r.alpha || 0) * f);
    }
    const ac = e.acceleration;
    if (ac && ac.x !== null) shake(Math.hypot(ac.x || 0, ac.y || 0, ac.z || 0));
  });
}
// appli Android : l'écran de réglages pilote l'aperçu (affiché dans un cadre) par messages
addEventListener('message', e => {
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.lorenzProps && typeof d.lorenzProps === 'object') window.wallpaperPropertyListener.applyUserProperties(d.lorenzProps);
  if (MOBILE && Array.isArray(d.lorenzPhone) && Object.prototype.hasOwnProperty.call(phone, d.lorenzPhone[0])) phone[d.lorenzPhone[0]](...d.lorenzPhone.slice(1));
});
if (DEBUG) window.__dbg = { PH, kick, cfg, phone, pos: () => pos, shown: () => col, N: () => N };

function pass(prog, target, tex, texel) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb);
  gl.viewport(0, 0, target.w, target.h);
  gl.useProgram(prog.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(prog.u.uTex, 0);
  gl.uniform2f(prog.u.uTexel, texel[0], texel[1]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

let t = 0, yaw = 0.6, acc = 0, prev = performance.now(), lastDraw = prev;
const t0 = qs.has('t') ? +qs.get('t') : 0;

/* Qualité auto : on ne baisse la résolution que si le GPU ne tient plus la cadence demandée,
   et on la remonte dès qu'il a de la marge. Quand tout va bien, rendu identique. */
let avgIv = 0, minIv = 1e9, slowT = 0, fastT = 0, upBlockT = 0;
function adapt(iv) {
  if (iv <= 0 || iv > 250) return;                                 // reprise après pause : on ignore
  minIv = Math.min(minIv * 1.002, Math.max(iv, 4));                // période de l'écran (estimée)
  avgIv = avgIv ? avgIv + (iv - avgIv) * 0.1 : iv;
  if (cfg.quality !== 0) return;
  const target = Math.max(cfg.fps > 0 ? 1000 / cfg.fps : 0, minIv);
  const s = iv / 1000;
  upBlockT = Math.max(0, upBlockT - s);
  if (avgIv > target * 1.25) { slowT += s; fastT = 0; } else if (avgIv < target * 1.08) { fastT += s; slowT = 0; } else { slowT = fastT = 0; }
  if (slowT > 1.5 && renderScale > 0.6) {
    renderScale = Math.max(0.6, renderScale * 0.85); slowT = 0; upBlockT = 20; resize();
  } else if (fastT > 6 && renderScale < 1 && upBlockT <= 0) {
    renderScale = Math.min(1, renderScale / 0.85); fastT = 0; upBlockT = 10; resize();
  }
}

function frame(now) {
  rafId = requestAnimationFrame(frame);
  if (cfg.fps > 0) {
    const iv = 1000 / cfg.fps, el = now - lastDraw;
    if (el < iv - 1) return;
    lastDraw = el > iv * 3 ? now : lastDraw + iv;   // cadence régulière, sans dérive
  } else lastDraw = now;
  adapt(now - prev);
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
  t += dt;

  bass += (bassT - bass) * (bassT > bass ? 0.5 : 0.08);
  bassT *= 0.9;

  const T = t + t0;
  SIG = 10 + Math.sin(T * 0.045 + 1) * 3 * cfg.morph;
  RHO = 28 + Math.sin(T * 0.06) * 3.8 * cfg.morph;
  acc += dt;
  let n = 0;
  while (acc >= TICK && n < 4) { tick(1 + bass * 0.35); acc -= TICK; n++; }
  if (n === 4) acc = 0;

  // caméra : orbite lente + parallaxe souris amortie
  yaw += dt * cfg.autoRotate;
  // écran vertical (téléphone, écran pivoté) : l'attracteur est tourné et la caméra recule pour qu'il tienne en largeur
  const aspect = W / H, portrait = aspect < 0.95;
  const rollFix = cfg.roll >= 0 ? cfg.roll : portrait ? 2.25 : 0;                // les deux ailes l'une au-dessus de l'autre
  // souris : position absolue -> angle (±2 rad sur chaque axe), l'angle reste où on le laisse.
  // La face avant de l'attracteur suit le curseur dans les deux axes (avant, l'axe horizontal était inversé).
  // L'écart au repos est ramené dans le repère de l'image avant sa rotation, pour rester juste sur écran vertical.
  const k = 1 - Math.pow(0.0005, dt);
  const tx = cfg.mouse && !MOBILE ? mxT * cfg.mouseStrength : 0, ty = cfg.mouse && !MOBILE ? myT * cfg.mouseStrength : 0.2;
  mx += (tx - mx) * k; my += (ty - my) * k;
  const ex = mx, ey = my - 0.2, cR = Math.cos(rollFix), sR = Math.sin(rollFix);
  const cam = {
    t: t + t0,
    yaw: yaw + Math.sin(T * 0.11) * 0.5 * cfg.sway - (cR * ex - sR * ey) * 2,
    pitch: Math.sin(T * 0.13) * 0.32 * cfg.sway + 0.4 + (sR * ex + cR * ey) * 2,
    dist: 3.6 + Math.sin(T * 0.09) * 0.45 * cfg.sway - bass * 0.2,
    roll: Math.sin(T * 0.07) * 0.16 * cfg.sway + rollFix,
    focal: 1 / Math.tan((38 * Math.PI / 180) / 2),
  };
  cam.dist *= cfg.zoom > 0 ? cfg.zoom : portrait ? Math.min(2.2, Math.max(1, 0.72 / aspect)) : 1;
  cam.rot = rotation(cam.yaw, cam.pitch, cam.roll);
  if (MOBILE) applyMobile(cam, dt);                      // doigt, gyroscope : rotations dans le repère de l'écran
  if (DEBUG) window.__cam = { rot: Array.from(cam.rot), dist: cam.dist, yaw: cam.yaw, pitch: cam.pitch };

  // 1. scène (traînées 3D + têtes) en HDR, additive, MSAA si possible
  gl.bindFramebuffer(gl.FRAMEBUFFER, ms ? ms.fb : scene.fb);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  const density = Math.sqrt(900 / N) * (HDR ? 1 : 0.5);
  const intensity = 0.13 * density * cfg.brightness * (1 + bass * 0.5);

  gl.useProgram(P_LINE.p); bindCommon(P_LINE.u, cam);
  gl.uniform1f(P_LINE.u.uIntensity, intensity);
  const sub = Math.max(1, Math.min(8, cfg.smooth | 0));
  gl.uniform1i(P_LINE.u.uSub, sub);
  const ribbon = cfg.aa === 1;
  gl.uniform1i(P_LINE.u.uRibbon, ribbon ? 1 : 0);
  gl.uniform2f(P_LINE.u.uRes, W, H);
  gl.uniform1f(P_LINE.u.uWarpGlow, cfg.spdMode ? Math.min(1, Math.abs(Math.log(Math.max(0.05, cfg.spdIn) / Math.max(0.05, cfg.spdOut))) / Math.log(4)) : 0);
  if (ribbon) gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, ((L - 1) * sub + 1) * 2, N);
  else gl.drawArraysInstanced(gl.LINE_STRIP, 0, (L - 1) * sub + 1, N);

  gl.useProgram(P_HEAD.p); bindCommon(P_HEAD.u, cam);
  gl.uniform1f(P_HEAD.u.uHeadSize, Math.max(2, Math.min(W, H) / 260));
  gl.uniform1f(P_HEAD.u.uHeadI, 0.9 * cfg.heads * density * (1 + bass));
  gl.drawArrays(gl.POINTS, 0, N);

  if (ms) {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, ms.fb);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, scene.fb);
    gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.invalidateFramebuffer(gl.READ_FRAMEBUFFER, [gl.COLOR_ATTACHMENT0]);
  }

  // 2. bloom (dual filter : descente puis remontée additive)
  gl.disable(gl.BLEND);
  let src = scene;
  for (const lv of levels) { pass(P_DOWN, lv, src.t, [1 / src.w, 1 / src.h]); src = lv; }
  gl.enable(gl.BLEND);
  for (let i = levels.length - 1; i > 0; i--) pass(P_UP, levels[i - 1], levels[i].t, [1 / levels[i].w, 1 / levels[i].h]);
  gl.disable(gl.BLEND);

  // 3. nébuleuse basse résolution, recalculée ~20 fois par seconde (elle évolue très lentement)
  nebAge += dt;
  if (nebAge >= 0.05 && cfg.nebula > 0) {
    nebAge = 0; nebClear = false;
    gl.bindFramebuffer(gl.FRAMEBUFFER, neb.fb);
    gl.viewport(0, 0, neb.w, neb.h);
    gl.useProgram(P_NEB.p);
    gl.uniform2f(P_NEB.u.uRes, W, H);
    gl.uniform2f(P_NEB.u.uCam, cam.yaw, cam.pitch);
    gl.uniform3fv(P_NEB.u.uTint, tint);
    gl.uniform3fv(P_NEB.u.uTint2, tint2);
    gl.uniform1f(P_NEB.u.uTime, cam.t);
    gl.uniform1f(P_NEB.u.uNebula, cfg.nebula);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  } else if (cfg.nebula <= 0 && !nebClear) {
    nebClear = true;
    gl.bindFramebuffer(gl.FRAMEBUFFER, neb.fb); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  }

  // 4. composition finale
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  const u = P_COMP.u;
  gl.useProgram(P_COMP.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.t); gl.uniform1i(u.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, levels[0].t); gl.uniform1i(u.uBloom, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, neb.t); gl.uniform1i(u.uNeb, 2);
  gl.uniform2f(u.uRes, W, H);
  gl.uniform2f(u.uCam, cam.yaw, cam.pitch);
  gl.uniform3fv(u.uTint, tint);
  gl.uniform1f(u.uTime, cam.t);
  gl.uniform1f(u.uBloomI, 0.4 * cfg.bloom * (1 + bass * 1.2));
  gl.uniform1f(u.uExposure, 1.0);
  gl.uniform1f(u.uStars, cfg.stars);
  gl.uniform1f(u.uPulse, bass);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

updatePalette();
resize();
alloc();
for (let i = +(qs.get('warm') || 0); i > 0; i--) tick(1);
rafId = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
