<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lorenz Chaos</title>
<style>
  html, body { margin: 0; height: 100%; background: #030307; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #8a86a6; font: 15px/1.5 system-ui, sans-serif; text-align: center; padding: 2em; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ *
 *  Réglages (modifiables depuis Wallpaper Engine, voir project.json)  *
 * ------------------------------------------------------------------ */
const cfg = {
  count: 900,          // nombre de particules
  trail: 170,          // longueur des traînées (en ticks de 1/60 s)
  speed: 0.8,          // vitesse de simulation
  palette: 0,          // 0 spectre, 1 néon, 2 aurore, 3 braise, 4 glacier, 5 or, 6 perso
  custom: [0.48, 0.18, 1.0],
  skyPalette: 0,       // couleurs du ciel : 0 comme les traînées, 1 à 9 palettes du ciel, 10 couleur choisie
  skyCustom: [0.25, 0.55, 1.0],
  hueSpeed: 0.05,      // défilement des couleurs
  spread: 1.0,         // étalement de la palette entre particules
  bloom: 1.0,
  brightness: 1.0,
  heads: 1.0,          // éclat des têtes de particules
  autoRotate: 0,       // rad/s
  smooth: 4,           // lissage des courbes (subdivisions par segment, calculées sur le GPU)
  sway: 0,             // balancement de la caméra (tangage, roulis, travelling)
  morph: 0,            // respiration de la forme (paramètres de Lorenz qui varient)
  mouse: true,
  mouseStrength: 1.0,
  stars: 1.0,
  nebula: 1.0,
  audio: true,
  audioGain: 1.0,
  ribbon: false,       // départ en ruban serré (comme l'original) au lieu d'un attracteur déjà rempli
  fps: 0,
  quality: 0,          // 0 auto (résolution réduite seulement si le GPU ne tient pas la cadence), 1 toujours pleine résolution
  spdMode: true,       // vitesses choisies au centre et sur les bords (false = vitesses naturelles de Lorenz)
  spdIn: 2.0,          // vitesse visible au centre (passage d'une aile à l'autre)
  spdOut: 0.5,         // vitesse visible sur les bords extérieurs
  roll: -1,            // rotation de l'image (rad), -1 = auto : 90° sur écran vertical
  zoom: 0,             // recul de la caméra, 0 = auto (s'adapte aux écrans verticaux)
  aa: 1,               // anticrénelage des traînées : 1 analytique (léger), 4 ou 2 MSAA, 0 aucun
  mobile: -1,          // -1 auto (écran tactile hors Wallpaper Engine), 0 version PC, 1 version téléphone
  // version téléphone
  touch: 1,            // sensibilité du doigt (0 = ignoré)
  tilt: 1,             // force de l'inertie quand on tourne le téléphone (0 = gyroscope ignoré)
  tiltInv: false,      // inertie inversée (l'attracteur tourne avec le téléphone, en plus)
  shake: true,         // secouer le téléphone disperse les particules
  recenter: 8,         // secondes sans toucher avant le retour à la vue de départ (0 = jamais)
  pan: true,           // légère rotation quand on change de page sur l'écran d'accueil
  native: false,       // capteurs fournis par l'appli Android (window.__phone) au lieu du navigateur
  profile: 0,          // qualité : 0 auto (selon le téléphone), 1 économe, 2 équilibrée, 3 élevée, 4 maximale, 5 perso
  boost: true,         // plus d'images par seconde seulement pendant qu'on le touche ou qu'on bouge le téléphone
};

const qs = new URLSearchParams(location.search);
const has = k => Object.prototype.hasOwnProperty.call(cfg, k) && typeof cfg[k] !== 'object';
for (const [k, v] of qs) if (has(k)) cfg[k] = typeof cfg[k] === 'boolean' ? v === '1' || v === 'true' : +v;
const fromHex = h => [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const hexQ = qs.get('color') || '', skyQ = qs.get('skycolor') || '';   // couleurs perso : color=7a2eff, skycolor=3f8cff
if (/^[0-9a-f]{6}$/i.test(hexQ)) cfg.custom = fromHex(hexQ);
if (/^[0-9a-f]{6}$/i.test(skyQ)) cfg.skyCustom = fromHex(skyQ);

// Wallpaper Engine injecte ses fonctions avant le chargement de la page
const IN_WE = typeof window.wallpaperRegisterAudioListener === 'function';
const MOBILE = cfg.mobile === 1 || (cfg.mobile === -1 && !IN_WE && !!(window.matchMedia && matchMedia('(pointer: coarse)').matches));
/* Profils de qualité de la version téléphone. En auto, le profil est choisi d'après la puce graphique, la
   mémoire, le nombre de cœurs et le mode économie d'énergie, puis abaissé si le téléphone ne suit vraiment pas.
   Batterie : peu d'images par seconde au repos (fps), davantage seulement pendant qu'on interagit (boost). */
const PROFILES = [null,
  { count: 300, trail: 110, smooth: 2, fps: 24, boost: 30, aa: 1, quality: 0, dpr: 1.35, sky: 520 },    // économe
  { count: 500, trail: 140, smooth: 3, fps: 30, boost: 45, aa: 1, quality: 0, dpr: 1.75, sky: 700 },    // équilibrée
  { count: 750, trail: 170, smooth: 3, fps: 30, boost: 60, aa: 1, quality: 0, dpr: 2, sky: 900 },       // élevée
  { count: 1100, trail: 220, smooth: 4, fps: 30, boost: 60, aa: 1, quality: 0, dpr: 2.6, sky: 900 },    // maximale
];
const PERF_KEYS = ['count', 'trail', 'smooth', 'fps', 'aa', 'quality'];
let DPR_CAP = 2, SKY_DENSITY = 900, BOOST_FPS = 60, tierInfo = null;   // résolution max (par pixel CSS), finesse du ciel
// économie d'énergie activée, ou téléphone qui chauffe : profil économe et jamais d'images en plus
const LOWPOWER = qs.get('saver') === '1' || qs.get('heat') === '1';
let liveUntil = 0, sleepId = 0;                            // jusqu'à quand on rend plus d'images (interaction en cours)
const live = ms => {
  liveUntil = Math.max(liveUntil, performance.now() + ms);
  if (sleepId) { clearTimeout(sleepId); sleepId = 0; if (!paused) rafId = requestAnimationFrame(frame); }   // réveil immédiat
};
const fpsNow = () => MOBILE && cfg.boost && !LOWPOWER && cfg.fps > 0 && performance.now() < liveUntil ? Math.max(cfg.fps, BOOST_FPS) : cfg.fps;
// sur téléphone, valeurs de départ du profil « perso » quand elles ne sont pas données dans l'adresse
if (MOBILE) for (const [k, v] of Object.entries({ count: 500, trail: 140, smooth: 3, fps: 30, palette: 4 })) if (!qs.has(k)) cfg[k] = v;
const DEBUG = qs.has('debug');
let applyMobile = () => {};                            // remplacé par le module téléphone plus bas

/* ---------------------------- WebGL setup ---------------------------- */
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
const fail = msg => { const e = document.getElementById('err'); e.textContent = msg; e.style.display = 'grid'; };
if (!gl) { fail('Ce fond d\'écran a besoin de WebGL 2.'); return; }
/* Carte graphique réinitialisée (verrouillage, veille, changement d'écran ou de pilote) : tout ce qui était sur
   la carte est perdu, on recharge la page (les réglages sont gardés, voir savedProps). */
let reloading = false;
const reloadPage = () => { if (!reloading) { reloading = true; location.reload(); } };
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); setTimeout(reloadPage, 3000); });
canvas.addEventListener('webglcontextrestored', reloadPage);

// cibles HDR (RGBA16F) : EXT_color_buffer_float sur PC, souvent seulement EXT_color_buffer_half_float sur téléphone
const HDR = (!!gl.getExtension('EXT_color_buffer_float') || !!gl.getExtension('EXT_color_buffer_half_float')) && (() => {
  const t = gl.createTexture(), fb = gl.createFramebuffer();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, 4, 4, 0, gl.RGBA, gl.HALF_FLOAT, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(fb); gl.deleteTexture(t);
  return ok;
})();
const IFMT = HDR ? gl.RGBA16F : gl.RGBA8;
const ITYPE = HDR ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
const MAX_TEX = gl.getParameter(gl.MAX_TEXTURE_SIZE);
const MAX_SAMPLES = gl.getParameter(gl.MAX_SAMPLES) || 0;
const samples = () => cfg.aa > 1 ? Math.min(cfg.aa | 0, MAX_SAMPLES) : 0;

/* Niveau du téléphone (1 à 4) d'après sa puce graphique : Adreno (Qualcomm), Mali / Immortalis (Arm), Xclipse
   (Samsung), PowerVR (Imagination), puis bridé par la mémoire, les cœurs et le mode économie d'énergie. */
function detectTier() {
  let gpu = '';
  try {
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    gpu = String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER) || '');
  } catch (e) {}
  const g = gpu.toLowerCase();
  let tier = 0, m;
  if ((m = g.match(/adreno\D*(\d{3})/))) { const n = +m[1]; tier = n >= 730 ? 4 : n >= 650 ? 3 : n >= 616 ? 2 : 1; }
  else if (/immortalis|xclipse|dxt/.test(g)) tier = 4;
  else if ((m = g.match(/mali-?g(\d+)/))) { const n = +m[1]; tier = n >= 700 ? 4 : n >= 600 || (n >= 77 && n < 100) ? 3 : n >= 57 ? 2 : 1; }
  else if (/apple/.test(g)) tier = 3;
  else if (/bxm/.test(g)) tier = 2;
  else if (/mali|powervr|sgx|videocore|vivante|tegra/.test(g)) tier = 1;
  if (!tier) tier = 2;                                     // puce inconnue : équilibrée, la qualité auto ajuste ensuite
  const mem = +qs.get('ram') || navigator.deviceMemory || 0, cores = +qs.get('cores') || navigator.hardwareConcurrency || 0;
  const why = [];
  if (mem && mem < 3) { tier = Math.min(tier, 1); why.push('mémoire'); } else if (mem && mem < 5 && tier > 2) { tier = 2; why.push('mémoire'); }
  if (cores && cores <= 4 && tier > 1) { tier = 1; why.push('processeur'); }
  if (qs.get('lowram') === '1' && tier > 1) { tier = 1; why.push('mémoire'); }
  if (!HDR && tier > 1) { tier = 1; why.push('puce graphique'); }
  if (qs.get('saver') === '1' && tier > 1) { tier = 1; why.push('économie d\'énergie'); }
  if (qs.get('heat') === '1' && tier > 1) { tier = 1; why.push('téléphone chaud'); }
  return { tier, gpu, mem, cores, why };
}
function applyProfile(t) {
  const P = PROFILES[t];
  for (const k of PERF_KEYS) cfg[k] = P[k];
  DPR_CAP = P.dpr; SKY_DENSITY = P.sky; BOOST_FPS = P.boost;
  tierInfo.applied = t;
}
if (MOBILE) {
  tierInfo = detectTier();
  if (cfg.profile !== 5) applyProfile(cfg.profile >= 1 && cfg.profile <= 4 ? cfg.profile : tierInfo.tier);
}
// l'écran de réglages de l'appli affiche ce qui a été détecté et les valeurs appliquées
function reportQuality() {
  if (!MOBILE || window.parent === window) return;
  const values = {}; for (const k of PERF_KEYS) values[k] = cfg[k];
  try { window.parent.postMessage({ lorenzQuality: { ...tierInfo, profile: cfg.profile, values } }, '*'); } catch (e) {}
}

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name);
  }
  return { p, u };
}

/* ------------------------------ Shaders ------------------------------ */
const COMMON = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform sampler2D uHist;
uniform int uL, uHead, uFilled;
uniform mat3 uRot;
uniform float uZc, uN, uDist, uFocal, uAspect, uScale, uTime, uHueSpeed, uSpread, uRainbow, uIntensity;
uniform vec3 uPal[4];

vec3 palette(float t) {
  if (uRainbow > 0.5) {
    vec3 k = clamp(abs(mod(fract(t) * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
    return pow(mix(vec3(1.0), k, 0.97), vec3(2.2));
  }
  t = fract(t) * 4.0;
  int i = int(t) % 4;
  return mix(uPal[i], uPal[(i + 1) % 4], smoothstep(0.0, 1.0, fract(t)));
}
vec4 project(vec3 s, out float depth) {
  vec3 w = vec3(s.x, s.y, s.z - uZc) * uScale;
  w = uRot * w;
  float zc = uDist - w.z;
  depth = clamp((zc - uDist + 1.25) / 2.5, 0.0, 1.0);
  return vec4(w.x * uFocal / uAspect, w.y * uFocal, 0.0, zc);
}
// teinte cohérente dans l'espace (les zones gardent une couleur franche) + décalage par particule
float hueAt(vec3 s, int p) { return s.x / 46.0 + s.z / 90.0 + float(p) / uN * uSpread * 0.18 + uTime * uHueSpeed; }
vec4 fetch(int p, int k) { return texelFetch(uHist, ivec2(p, (uHead - k + uL * 8) % uL), 0); }
`;

const LINE_VS = COMMON + `
out vec3 vCol;
out float vD;
uniform int uSub, uRibbon;
uniform vec2 uRes;
uniform float uWarpGlow;
void main() {
  // une instance = une particule, dessinée d'un seul tenant : chaque point de la courbe est calculé une seule fois
  // chaque intervalle entre deux points d'historique est découpé en uSub morceaux (spline Catmull-Rom)
  // uRibbon = 1 : ruban de 2 px avec couverture analytique (anticrénelage exact, sans MSAA)
  int p = gl_InstanceID;
  vD = 0.0;
  if (uFilled < 2) { gl_Position = vec4(0.0, 0.0, -2.0, 1.0); vCol = vec3(0.0); return; }
  int v = uRibbon == 1 ? gl_VertexID >> 1 : gl_VertexID;
  float side = float(gl_VertexID & 1) * 2.0 - 1.0;
  int vMax = (uFilled - 1) * uSub;
  bool hidden = v > vMax;                 // au-delà de l'historique rempli : segment dégénéré et noir
  v = min(v, vMax);
  int kSeg = min(v / uSub, uFilled - 2);
  float u = float(v - kSeg * uSub) / float(uSub);
  vec4 p0 = fetch(p, max(kSeg - 1, 0));
  vec4 p1 = fetch(p, kSeg);
  vec4 p2 = fetch(p, kSeg + 1);
  vec4 p3 = fetch(p, min(kSeg + 2, uFilled - 1));
  float u2 = u * u, u3 = u2 * u;
  vec4 s = 0.5 * (2.0 * p1 + (p2 - p0) * u + (2.0 * p0 - 5.0 * p1 + 4.0 * p2 - p3) * u2 + (3.0 * p1 - p0 - 3.0 * p2 + p3) * u3);
  float d; gl_Position = project(s.xyz, d);
  if (uRibbon == 1 && !hidden) {
    // direction de la courbe à l'écran (dérivée exacte de la spline), puis décalage perpendiculaire de 1 px
    vec3 ds = 0.5 * ((p2 - p0).xyz + 2.0 * u * (2.0 * p0 - 5.0 * p1 + 4.0 * p2 - p3).xyz + 3.0 * u2 * (3.0 * p1 - p0 - 3.0 * p2 + p3).xyz);
    float d2; vec4 q = project(s.xyz + ds * 0.05, d2);
    vec2 dir = (q.xy / q.w - gl_Position.xy / gl_Position.w) * uRes;
    float l = length(dir);
    vec2 n = l > 1e-6 ? vec2(-dir.y, dir.x) / l : vec2(0.0, 1.0);
    gl_Position.xy += n * side * (2.0 / uRes) * gl_Position.w;
    vD = side;
  }
  float age = (float(kSeg) + u) / float(uL - 1);
  float fade = pow(1.0 - age, 1.8);
  vec3 c = palette(hueAt(s.xyz, p) + age * 0.08);
  c = mix(c, vec3(1.0), smoothstep(150.0, 280.0, s.w) * 0.2);   // zones rapides = plus blanches
  float glow = mix(1.0, mix(0.6, 1.5, smoothstep(40.0, 320.0, s.w)), uWarpGlow);   // rapide = plus lumineux
  vCol = hidden ? vec3(0.0) : c * fade * mix(1.5, 0.3, d) * uIntensity * glow;
}`;

const LINE_FS = `#version 300 es
precision highp float;
in vec3 vCol; in float vD; out vec4 o;
// couverture d'une ligne de 1 px filtrée par le pixel : triangle de demi-largeur 1 px, intégrale = 1
void main() { o = vec4(vCol * max(0.0, 1.0 - abs(vD)), 1.0); }`;

const HEAD_VS = COMMON + `
uniform float uHeadSize, uHeadI;
out vec3 vCol;
void main() {
  int p = gl_VertexID;
  vec4 s = fetch(p, 0);
  float d; gl_Position = project(s.xyz, d);
  gl_PointSize = uFilled > 1 ? uHeadSize * mix(1.7, 0.5, d) : 0.0;
  vec3 c = palette(hueAt(s.xyz, p));
  vCol = mix(c, vec3(1.0), 0.45) * mix(1.6, 0.25, d) * uHeadI;
}`;

const HEAD_FS = `#version 300 es
precision highp float;
in vec3 vCol; out vec4 o;
void main() {
  vec2 q = gl_PointCoord * 2.0 - 1.0;
  float r = dot(q, q);
  o = vec4(vCol * (exp(-r * 6.0) - exp(-6.0)), 1.0);
}`;

const QUAD_VS = `#version 300 es
out vec2 vUv;
void main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); vUv = p; gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

const DOWN_FS = `#version 300 es
precision mediump float;
uniform mediump sampler2D uTex; uniform highp vec2 uTexel;
in highp vec2 vUv; out vec4 o;
void main() {
  vec3 s = texture(uTex, vUv).rgb * 4.0;
  s += texture(uTex, vUv - uTexel).rgb;
  s += texture(uTex, vUv + uTexel).rgb;
  s += texture(uTex, vUv + vec2(uTexel.x, -uTexel.y)).rgb;
  s += texture(uTex, vUv - vec2(uTexel.x, -uTexel.y)).rgb;
  o = vec4(s / 8.0, 1.0);
}`;

const UP_FS = `#version 300 es
precision mediump float;
uniform mediump sampler2D uTex; uniform highp vec2 uTexel;
in highp vec2 vUv; out vec4 o;
void main() {
  highp vec2 t = uTexel;
  vec3 s = texture(uTex, vUv + vec2(-2.0 * t.x, 0.0)).rgb;
  s += texture(uTex, vUv + vec2( 2.0 * t.x, 0.0)).rgb;
  s += texture(uTex, vUv + vec2(0.0, -2.0 * t.y)).rgb;
  s += texture(uTex, vUv + vec2(0.0,  2.0 * t.y)).rgb;
  s += texture(uTex, vUv + vec2(-t.x,  t.y)).rgb * 2.0;
  s += texture(uTex, vUv + vec2( t.x,  t.y)).rgb * 2.0;
  s += texture(uTex, vUv + vec2(-t.x, -t.y)).rgb * 2.0;
  s += texture(uTex, vUv + vec2( t.x, -t.y)).rgb * 2.0;
  o = vec4(s / 12.0, 1.0);
}`;

const COMP_FS = `#version 300 es
precision highp float;
uniform sampler2D uScene, uBloom, uSky, uSkyB;
uniform float uSkyMix;
uniform vec2 uRes, uCam, uExt;
uniform float uTime, uBloomI, uExposure, uStars, uPulse, uPx;
in vec2 vUv; out vec4 o;

float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
// couleur d'une étoile selon sa température : orangée, blanche ou bleutée
vec3 starTint(float h) {
  return h < 0.55 ? mix(vec3(1.0, 0.68, 0.42), vec3(1.0, 0.95, 0.88), smoothstep(0.0, 0.55, h))
                  : mix(vec3(1.0, 0.95, 0.88), vec3(0.64, 0.77, 1.0), smoothstep(0.55, 1.0, h));
}
// petites étoiles : profil gaussien d'au moins ~0,8 pixel réel (pas de grésillement quand le ciel glisse),
// éclat conservé ; les 4 cellules voisines sont examinées pour ne jamais couper une étoile au bord d'une cellule
vec3 fine(vec2 fc, float cell, float dens, float size, float seed) {
  vec2 i0 = floor(fc / cell - 0.5);
  float sig = max(size, 0.8 * uPx), k = size * size / (sig * sig), inv = -0.5 / (sig * sig);
  vec3 acc = vec3(0.0);
  for (int j = 0; j < 4; j++) {
    vec2 id = i0 + vec2(float(j & 1), float(j >> 1));
    if (hash(id + seed) >= dens) continue;
    vec2 v = fc - (id + 0.5 + (vec2(hash(id + seed + 1.7), hash(id + seed + 3.1)) - 0.5) * 0.8) * cell;
    float m = hash(id + seed + 5.3);
    acc += starTint(hash(id + seed + 8.8)) * (m * m * m * m) * k * exp(dot(v, v) * inv);
  }
  return acc;
}
// étoiles faibles, une au plus par cellule, centre loin des bords : une seule cellule à examiner
vec3 faint(vec2 fc, float cell, float dens, float size, float seed) {
  vec2 id = floor(fc / cell);
  float h = hash(id + seed);
  if (h >= dens) return vec3(0.0);
  vec2 v = fc - (id + 0.25 + 0.5 * vec2(hash(id + seed + 1.7), hash(id + seed + 3.1))) * cell;
  float sig = max(size, 0.8 * uPx), m = hash(id + seed + 5.3);
  return starTint(hash(id + seed + 8.8)) * (m * m * m * m) * (size * size / (sig * sig)) * exp(-dot(v, v) / (2.0 * sig * sig));
}
// étoiles plus proches (une au plus par cellule) : cœur net et halo doux ; pour la couche la plus proche,
// aigrettes discrètes sur les plus fortes et, dans quelques cellules, une galaxie lointaine
vec3 near(vec2 fc, float cell, float dens, float size, float seed, float extra) {
  vec2 id = floor(fc / cell);
  float h = hash(id + seed);
  if (h >= dens) return vec3(0.0);
  vec2 v = fc - (id + 0.3 + 0.4 * vec2(hash(id + seed + 1.7), hash(id + seed + 3.1))) * cell;
  float m = hash(id + seed + 5.3), b = m * m * m;
  if (extra > 0.5 && h < dens * 0.1) {                   // galaxie : petite tache allongée au cœur plus clair
    float a = hash(id + seed + 7.1) * 3.1416, ca = cos(a), sa = sin(a);
    vec2 r = vec2(ca * v.x + sa * v.y, -sa * v.x + ca * v.y) / (max(uPx, 1.0) * vec2(4.5, 1.6) * (0.7 + m));
    float d = dot(r, r);
    return vec3(1.0, 0.88, 0.76) * (exp(-d) * 0.22 + exp(-d * 10.0) * 0.45) * (0.35 + m);
  }
  float sig = max(size * (0.7 + b), 0.8 * uPx), d2 = dot(v, v);
  float s = exp(-d2 / (2.0 * sig * sig)) + exp(-sqrt(d2) / (sig * 2.5)) * 0.06 * b;
  if (extra > 0.5 && b > 0.3) {                          // aigrettes de diffraction, courtes
    float L = sig * (3.0 + 7.0 * b), wl = 0.5 * max(uPx, 1.0);
    s += (exp(-abs(v.y) / wl - abs(v.x) / L) + exp(-abs(v.x) / wl - abs(v.y) / L)) * 0.22 * b;

  float tw = 0.9 + 0.1 * sin(uTime * (0.25 + m * 1.6) + h * 50.0);   // scintillement à peine perceptible
  return starTint(hash(id + seed + 8.8)) * s * (0.2 + b * 2.4) * tw;
}
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }

void main() {
  vec2 uv = vUv;
  vec2 p = (uv - 0.5) * vec2(uRes.x / uRes.y, 1.0);
  float r = length(p);

  // ciel lointain (Voie lactée, nébuleuses), calculé à part et lentement : il glisse un peu avec la caméra
  vec2 sc = 3.2 * tanh(uCam / 3.2), sh = sc * vec2(0.048, 0.032);
  vec2 suv = (p + sh) / uExt * 0.5 + 0.5;
  vec4 sky = mix(texture(uSky, suv), texture(uSkyB, suv), uSkyMix);   // fondu entre l'ancien ciel et le nouveau
  vec3 bg = vec3(0.00035, 0.00035, 0.0007) + sky.rgb * sky.rgb * (1.0 + uPulse * 0.5);

  // étoiles : une poussière d'étoiles qui dessine la Voie lactée, puis des étoiles de plus en plus proches
  vec2 fc = gl_FragCoord.xy * uPx, fs = fc + sh * 1080.0;
  vec3 st = sky.a > 0.01 ? fine(fs, 3.6, sky.a * 0.6, 0.42, 0.0) * (1.0 + sky.a * 1.5) : vec3(0.0);   // seulement dans la bande
  st += faint(fs + sh * 270.0, 9.0, 0.16 + sky.a * 0.3, 0.5, 17.0) * 1.6;
  st += near(fc + uCam * 75.0, 30.0, 0.3, 0.62, 41.0, 0.0) * 1.1;
  st += near(fc + uCam * 120.0, 120.0, 0.32, 0.85, 63.0, 1.0) * 1.3;
  bg += st * 0.11 * uStars;

  // lumière : scène HDR + bloom avec aberration chromatique sur les bords
  vec2 ca = (uv - 0.5) * 0.006;
  vec3 bl = vec3(texture(uBloom, uv + ca).r, texture(uBloom, uv).g, texture(uBloom, uv - ca).b);
  vec3 hdr = texture(uScene, uv).rgb + bl * uBloomI;
  vec3 col = aces(hdr * uExposure) + bg;

  col *= mix(1.0, smoothstep(1.35, 0.25, r), 0.5);
  col = pow(col, vec3(1.0 / 2.2));
  col += (hash(gl_FragCoord.xy + fract(uTime * 7.3) * 113.0) - 0.5) * (2.5 / 255.0);
  o = vec4(col, 1.0);
}`;

/* Ciel lointain, calculé dans une texture à mi-résolution un peu plus grande que l'écran (marge pour la
   parallaxe). Il évolue très lentement : le ciel suivant est calculé en coulisse, une bande à la fois mais à
   un instant figé (sinon les raccords entre bandes descendent à l'écran comme une cascade), puis il remplace
   l'actuel en fondu enchaîné pendant que le suivant se prépare. */
const SKY_FS = `#version 300 es
precision highp float;
uniform vec2 uExt, uNebA, uNebB;
uniform vec3 uTint, uTint2;
uniform float uTime, uNebula, uMono;
in vec2 vUv; out vec4 o;
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + 1.0), f.x), f.y);
}
const mat2 ROT = mat2(0.8, 0.6, -0.6, 0.8);            // chaque octave tournée : aucun motif aligné sur une grille
float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { v += a * noise(p); p = ROT * p * 2.03 + 17.1; a *= 0.5; } return v; }
float ridge(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 5; i++) { float n = 1.0 - abs(noise(p) * 2.0 - 1.0); v += a * n * n; p = ROT * p * 2.07 + 9.3; a *= 0.5; } return v; }
vec3 sat(vec3 c) { c /= max(max(c.r, c.g), max(c.b, 1e-3)); return pow(c, vec3(1.8)); }
void main() {
  vec2 p = (vUv * 2.0 - 1.0) * uExt;
  float t = uTime * 0.004;
  // champs communs : volutes (deux niveaux de déformation)
  vec2 np = p * 1.7 + vec2(t, -t * 0.7);
  vec2 w1 = vec2(fbm(np), fbm(np + vec2(5.2, 1.3)));
  vec2 w2 = vec2(fbm(np + 3.0 * w1 + vec2(1.7, 9.2)), fbm(np + 3.0 * w1 + vec2(8.3, 2.8)));

  // Voie lactée : bande diagonale ondulée qui passe sous le centre, nuages d'étoiles, fissures de poussière
  vec2 bd = normalize(vec2(1.0, 0.42)), bn = vec2(-bd.y, bd.x);
  float al = dot(p, bd);
  float ac = dot(p, bn) + 0.14 + (noise(vec2(al * 1.6, 3.7)) - 0.5) * 0.16 + (noise(vec2(al * 4.3, 8.2)) - 0.5) * 0.05;
  float wd = 0.13 + 0.06 * noise(vec2(al * 1.1 + 11.0, 1.3));
  float prof = exp(-ac * ac / (wd * wd)), core = exp(-ac * ac / (wd * wd * 0.2));
  float asp = 2.0 * (uExt.x - 0.16);
  float clouds = fbm(p * 3.6 + w1 * 0.8 + 4.0);
  float knots = fbm(p * 9.0 + w2 * 1.2 + 21.0);                                      // amas d'étoiles serrés
  // renflement du centre galactique, sur le côté (en bas à droite sur PC, en bas au centre sur téléphone)
  float bulge = exp(-pow((al - 0.33 * asp) / 0.3, 2.0)) * exp(-ac * ac / (wd * wd * 1.8));
  float glow = prof * smoothstep(0.3, 0.85, clouds) * (0.45 + knots) + core * (0.3 + clouds) * 0.9 + bulge * (0.5 + 0.9 * clouds);
  vec2 dp = p * 2.6 + w1 * 1.4 + 3.1;
  float dust = smoothstep(0.5, 0.74, fbm(dp));
  float flecks = smoothstep(0.56, 0.72, fbm(dp * 2.3 + w2 * 1.6 + 7.0));             // poussière plus fine, en lambeaux
  float rift = exp(-pow((ac + 0.02) / (wd * 0.45), 2.0));
  float absorb = clamp(dust * (0.25 + 0.5 * rift) + flecks * 0.45 * prof, 0.0, 0.78);
  vec3 bandCol = mix(vec3(0.48, 0.6, 1.0), vec3(1.0, 0.77, 0.52), clamp(core * 0.9 + bulge * 0.8, 0.0, 1.0));   // bords bleutés, cœur doré
  bandCol = mix(bandCol, sat(mix(uTint, uTint2, 0.5)), 0.1);
  float light = glow * (1.0 - absorb);
  vec3 col = bandCol * light * 0.046;

  // nébuleuses à émission, aux couleurs de la palette, loin du centre où se trouve l'attracteur
  // l'enveloppe abaisse le seuil des nuages au lieu de les assombrir : des bords francs, pas de brume partout
  vec2 qa = (p - uNebA) / 0.62, qb = (p - uNebB) / 0.46;
  float ea = exp(-dot(qa, qa) * 1.4), eb = exp(-dot(qb, qb) * 1.6), e = max(ea, eb);
  float f = fbm(np + 2.6 * w2);
  float fil = ridge(np * 2.6 + w2 * 3.0);
  float fil3 = fil * fil * fil;
  // A : arcs de filaments d'un reste de supernova dont le centre est hors de l'écran ; B : nuages denses aux fronts lumineux
  vec2 dA = p - (uNebA + vec2(-0.3, 0.32));
  float rr = length(dA), an = atan(dA.y, dA.x);
  vec2 pa = vec2(rr * 10.0, an * 3.0) + w1 * 0.8;                                    // filaments le long des cercles
  float va = ridge(pa * vec2(1.0, 0.5) + 31.0), vb = ridge(pa * vec2(1.9, 0.9) + w2 * 0.6 + 57.0);
  float shell = exp(-pow((rr - 0.52) / 0.2, 2.0)) * smoothstep(0.02, 0.5, ea);
  float emA = (pow(va, 6.0) * 1.6 + pow(vb, 7.0) * 1.1) * (0.3 + fbm(pa * vec2(0.4, 0.8) + 9.0)) * shell;
  float thB = 0.9 - 0.42 * eb;
  float dB = smoothstep(thB, thB + 0.3, f);
  float rB = smoothstep(thB - 0.08, thB + 0.04, f) * (1.0 - smoothstep(thB + 0.04, thB + 0.25, f));
  float emB = (dB * dB * 1.2 + fil3 * (dB * 1.4 + rB * 0.9)) * smoothstep(0.08, 0.5, eb);
  vec3 ca = mix(sat(uTint2), sat(uTint), smoothstep(0.42, 0.62, rr + (fbm(pa * 0.5 + 3.0) - 0.5) * 0.25));   // deux couleurs, comme un front de choc
  vec3 cb = mix(sat(uTint), sat(uTint2), smoothstep(0.3, 1.0, length(w2)));
  vec3 neb = ca * emA * 0.26 + cb * emB * 0.18;
  neb += vec3(1.0, 0.9, 0.95) * smoothstep(thB + 0.25, thB + 0.5, f) * eb * 0.06;    // cœurs plus clairs
  float globules = smoothstep(0.6, 0.82, fbm(np * 2.1 + w2 * 2.5 + 40.0));           // nuages sombres irréguliers devant
  col += neb * (1.0 - absorb * 0.8) * (1.0 - globules * 0.55 * eb);
  col += sat(mix(uTint, uTint2, 0.5)) * exp(-dot(p, p) * 4.0) * 0.0025;                // halo derrière l'attracteur
  // couleur stockée en racine carrée : assez de précision dans les noirs même sans texture flottante
  col = mix(col, vec3(dot(col, vec3(0.3, 0.59, 0.11))), uMono);                       // ciel en noir et blanc
  o = vec4(sqrt(col * uNebula), clamp(light * 0.75, 0.0, 1.0));  // alpha : densité d'étoiles (forte dans les nuages de la bande)
}`;

let P_SKY, P_LINE, P_HEAD, P_DOWN, P_UP, P_COMP;
try {
  P_LINE = program(LINE_VS, LINE_FS);
  P_HEAD = program(HEAD_VS, HEAD_FS);
  P_DOWN = program(QUAD_VS, DOWN_FS);
  P_UP   = program(QUAD_VS, UP_FS);
  P_COMP = program(QUAD_VS, COMP_FS);
  P_SKY  = program(QUAD_VS, SKY_FS);
} catch (e) { fail('Erreur de shader : ' + e.message); console.error(e); return; }

const vao = gl.createVertexArray();
gl.bindVertexArray(vao);

/* --------------------------- Render targets --------------------------- */
function makeTex(w, h, ifmt, fmt, type, filter) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function makeTarget(w, h) {
  const t = makeTex(w, h, IFMT, gl.RGBA, ITYPE, gl.LINEAR);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { t, fb, w, h };
}
function freeTarget(r) { if (r) { gl.deleteTexture(r.t); gl.deleteFramebuffer(r.fb); } }

// ciel lointain : texture à mi-résolution avec une marge de parallaxe (SKY_M, en hauteurs d'écran), rafraîchie par bandes
const SKY_M = 0.16, SKY_STRIPS = 12;
let skyTex = [], skyOld = null, skyCur = null, skyBuild = null, skyExt = [1, 1], skyStrip = 0, skyFull = true, skyClear = false, skyT = 0, skyTime = 0;
let W = 0, H = 0, scene = null, ms = null, levels = [];
let renderScale = 1, msaaNow = -1;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP) * renderScale;
  const w = Math.max(1, Math.round(innerWidth * dpr)), h = Math.max(1, Math.round(innerHeight * dpr));
  if (w === W && h === H && msaaNow === samples()) return;
  msaaNow = samples();
  W = canvas.width = w; H = canvas.height = h;

  freeTarget(scene); skyTex.forEach(freeTarget); levels.forEach(freeTarget);
  skyExt = [W / H / 2 + SKY_M, 0.5 + SKY_M];
  const sd = Math.min(H * 0.75, SKY_DENSITY);                                 // pixels du ciel par hauteur d'écran
  const sw = Math.max(1, Math.round(2 * skyExt[0] * sd)), sh = Math.max(1, Math.round(2 * skyExt[1] * sd));
  skyTex = [makeTarget(sw, sh), makeTarget(sw, sh), makeTarget(sw, sh)];
  [skyOld, skyCur, skyBuild] = skyTex;
  skyFull = true; skyClear = false;
  if (ms) { gl.deleteRenderbuffer(ms.rb); gl.deleteFramebuffer(ms.fb); ms = null; }

  scene = makeTarget(W, H);
  const SAMPLES = samples();
  if (SAMPLES > 1) {
    const rb = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
    gl.renderbufferStorageMultisample(gl.RENDERBUFFER, SAMPLES, IFMT, W, H);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, rb);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE) ms = { rb, fb };
    else { gl.deleteRenderbuffer(rb); gl.deleteFramebuffer(fb); }
  }
  levels = [];
  let lw = W, lh = H;
  for (let i = 0; i < 6 && lw > 8 && lh > 8; i++) {
    lw = Math.max(1, lw >> 1); lh = Math.max(1, lh >> 1);
    levels.push(makeTarget(lw, lh));
  }
}

/* ---------------------------- Simulation ---------------------------- */
let SIG = 10, RHO = 28;
const BET = 8 / 3, SUB = 3, TICK = 1 / 60;
let N = 0, L = 0, pos, col, histTex = null, head = 0, filled = 0;

function lorenzStep(x, y, z, h, out) {
  let dx = SIG * (y - x), dy = x * (RHO - z) - y, dz = x * y - BET * z;
  const mx = x + dx * h * 0.5, my = y + dy * h * 0.5, mz = z + dz * h * 0.5;
  dx = SIG * (my - mx); dy = mx * (RHO - mz) - my; dz = mx * my - BET * mz;
  out[0] = x + dx * h; out[1] = y + dy * h; out[2] = z + dz * h; out[3] = Math.sqrt(dx * dx + dy * dy + dz * dz);
}

function alloc() {
  N = Math.max(16, Math.min(cfg.count | 0, MAX_TEX));
  L = Math.max(8, Math.min(cfg.trail | 0, MAX_TEX));
  pos = new Float32Array(N * 3);
  col = new Float32Array(N * 4);
  const tmp = new Float64Array(4);
  if (cfg.ribbon) {
    for (let i = 0; i < N; i++) { pos[i * 3] = 0.1 + (i / N) * 1.2; pos[i * 3 + 1] = 0; pos[i * 3 + 2] = 20; }
  } else {
    // particules étalées le long d'une longue trajectoire, puis légèrement perturbées
    let x = 0.1, y = 0, z = 20;
    for (let s = 0; s < 3000; s++) { lorenzStep(x, y, z, 0.005, tmp); [x, y, z] = tmp; }
    for (let i = 0; i < N; i++) {
      for (let s = 0; s < 7; s++) { lorenzStep(x, y, z, 0.004, tmp); [x, y, z] = tmp; }
      pos[i * 3]     = x + (Math.random() - 0.5) * 0.6;
      pos[i * 3 + 1] = y + (Math.random() - 0.5) * 0.6;
      pos[i * 3 + 2] = z + (Math.random() - 0.5) * 0.6;
    }
  }
  if (histTex) gl.deleteTexture(histTex);
  histTex = makeTex(N, L, gl.RGBA32F, gl.RGBA, gl.FLOAT, gl.NEAREST);   // une ligne par instant : mise à jour contiguë
  head = 0; filled = 0;
}

const stepOut = new Float64Array(4);
/* Vitesses au centre / sur les bords : chaque particule avance plus ou moins vite selon sa distance au
   plan de symétrie (x = 0, le milieu de l'écran). Le système étant autonome, les trajectoires restent
   exactement les mêmes : seule la vitesse le long de la courbe change. PROFIL compense la physique de
   Lorenz (les bords y sont naturellement ~5x plus rapides) pour que les curseurs donnent la vitesse visible. */
const PROFIL = 1.68, VBASE = 2.0;
const smooth01 = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
/* Secousse (version téléphone) : les particules sont écartées puis rappelées comme par un élastique, avec un
   léger rebond. Seul l'affichage est décalé : la simulation, elle, reste exactement sur l'attracteur. */
const kick = { t: 9, a: 0 };
let kickDir = null;
const KW = 2 * Math.PI * 1.1, KT = 0.25, KN = 0.4725;    // rebond à ~1 Hz amorti en ~0,25 s (KN : pic ramené à 1)
function tick(boost) {
  const h = 0.0025 * cfg.speed * boost;
  const custom = cfg.spdMode;
  const lIn = Math.log(Math.max(0.05, cfg.spdIn)), lOut = Math.log(Math.max(0.05, cfg.spdOut));
  const kickOn = kick.t < 1.6 && kickDir !== null && kickDir.length === N * 3;
  let ka = 0, kv = 0;
  if (kickOn) {
    kick.t += TICK;
    const e = Math.exp(-kick.t / KT), s = Math.sin(KW * kick.t);
    ka = kick.a * e * s / KN;                                                    // écart
    kv = Math.abs(kick.a * e * (KW * Math.cos(KW * kick.t) - s / KT) / KN);     // sa vitesse : les particules lancées brillent
  }
  for (let i = 0; i < N; i++) {
    const j = i * 3;
    let x = pos[j], y = pos[j + 1], z = pos[j + 2], v = 0;
    let w = 1;
    if (custom) {
      const d = Math.abs(x) / 18;
      const target = Math.exp(lIn + (lOut - lIn) * smooth01(0.05, 1.0, d));
      w = Math.min(8, Math.max(0.03, VBASE * target * Math.exp(-PROFIL * d)));
    }
    const hw = h * w;
    for (let s = 0; s < SUB; s++) { lorenzStep(x, y, z, hw, stepOut); x = stepOut[0]; y = stepOut[1]; z = stepOut[2]; v = stepOut[3]; }
    if (!isFinite(x + y + z)) { x = Math.random() - 0.5; y = 0; z = 20; }
    pos[j] = x; pos[j + 1] = y; pos[j + 2] = z;
    const k = i * 4; col[k] = x; col[k + 1] = y; col[k + 2] = z; col[k + 3] = v * w;   // vitesse apparente (éclat des zones rapides)
    if (kickOn) { col[k] += kickDir[j] * ka; col[k + 1] += kickDir[j + 1] * ka; col[k + 2] += kickDir[j + 2] * ka; col[k + 3] += kv * 3; }
  }
  head = (head + 1) % L;
  filled = Math.min(filled + 1, L);
  gl.bindTexture(gl.TEXTURE_2D, histTex);
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, head, N, 1, gl.RGBA, gl.FLOAT, col);
}

/* ------------------------------ Palettes ------------------------------ */
const hex = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16) / 255);
const PALETTES = [
  null,                                                   // spectre (HSL de l'original)
  ['#00e5ff', '#6f3bff', '#ff2bd6', '#2a7bff'],           // néon
  ['#00ffa3', '#00c2ff', '#8a5cff', '#ff4fd8'],           // aurore
  ['#ff2a00', '#ff8a00', '#ffd36b', '#ff2d6f'],           // braise
  ['#bff8ff', '#3fa9ff', '#6a5cff', '#e6fbff'],           // glacier
  ['#ffcf5a', '#ff9d2e', '#fff1c4', '#c9772b'],           // or
];
function hsl2rgb(h, s, l) {
  const f = n => { const k = (n + h * 12) % 12; return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
}
function rgb2hsl([r, g, b]) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  const h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h / 6, s, l];
}
// couleurs du ciel (nébuleuses, reste de supernova, teinte de la Voie lactée), indépendantes des traînées si on veut
const SKY_PALETTES = [
  null,                                                   // comme les traînées
  ['#2e8cff', '#ff2a4a'],                                 // Hubble : bleu et rouge
  ['#00e5ff', '#ff2bd6'],                                 // néon
  ['#00ffa3', '#8a5cff'],                                 // aurore
  ['#ff8a00', '#ff2a00'],                                 // braise
  ['#8fd8ff', '#7a6bff'],                                 // glacier
  ['#ffcf5a', '#ff8a2e'],                                 // or
  ['#b05cff', '#ff4fa8'],                                 // améthyste
  ['#00e08a', '#00b8c8'],                                 // émeraude

  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

let t = 0, yaw = 0.6, acc = 0, prev = performance.now(), lastDraw = prev;
const t0 = qs.has('t') ? +qs.get('t') : 0;

/* Qualité auto : on ne baisse la résolution que si le GPU ne tient plus la cadence demandée,
   et on la remonte dès qu'il a de la marge. Quand tout va bien, rendu identique. */
let avgIv = 0, minIv = 1e9, slowT = 0, fastT = 0, upBlockT = 0;
const HZ = +qs.get('hz') || 0;                                     // fréquence de l'écran, donnée par l'appli Android
function adapt(iv) {
  if (iv <= 0 || iv > 250) return;                                 // reprise après pause : on ignore
  minIv = HZ > 0 ? 1000 / HZ : Math.min(minIv * 1.002, Math.max(iv, 4));   // période de l'écran (connue ou estimée)
  avgIv = avgIv ? avgIv + (iv - avgIv) * 0.1 : iv;
  if (cfg.quality !== 0) return;
  const target = Math.max(cfg.fps > 0 ? 1000 / cfg.fps : 0, minIv);
  const s = iv / 1000;
  upBlockT = Math.max(0, upBlockT - s);
  if (avgIv > target * 1.25) { slowT += s; fastT = 0; } else if (avgIv < target * 1.08) { fastT += s; slowT = 0; } else { slowT = fastT = 0; }
  if (MOBILE && cfg.profile === 0 && tierInfo.applied > 1 && renderScale <= 0.61 && slowT > 3) {
    applyProfile(tierInfo.applied - 1); tierInfo.lowered = (tierInfo.lowered || 0) + 1;
    renderScale = 0.85; slowT = 0; upBlockT = 20; alloc(); W = 0; resize(); reportQuality();
  } else if (slowT > 1.5 && renderScale > 0.6) {
    renderScale = Math.max(0.6, renderScale * 0.85); slowT = 0; upBlockT = 20; resize();
  } else if (fastT > 6 && renderScale < 1 && upBlockT <= 0) {
    renderScale = Math.min(1, renderScale / 0.85); fastT = 0; upBlockT = 10; resize();
  }
}

/* Image suivante. Dans l'appli, sur un écran à 90-120 Hz, inutile de se réveiller à chaque rafraîchissement
   pour ne rien dessiner : on dort jusqu'à un peu avant l'image voulue, puis on se cale sur l'écran. */
function nextFrame() {
  const fps = fpsNow();
  if (cfg.native && HZ > 0 && fps > 0 && HZ > fps * 1.5) {
    const wait = lastDraw + 1000 / fps - performance.now() - 750 / HZ;   // réveil entre les deux derniers rafraîchissements
    if (wait > 1) { sleepId = setTimeout(() => { sleepId = 0; if (!paused) rafId = requestAnimationFrame(frame); }, wait); return; }
  }
  rafId = requestAnimationFrame(frame);
}
function frame(now) {
  rafId = 0; beat = performance.now();
  try { draw(now); } finally { if (!paused && !rafId && !sleepId) nextFrame(); }
}
function draw(now) {
  const fps = fpsNow();
  if (fps > 0) {
    const iv = 1000 / fps, el = now - lastDraw;
    if (el < iv - 1) return;
    lastDraw = el > iv * 3 ? now : lastDraw + iv;   // cadence régulière, sans dérive
  } else lastDraw = now;
  adapt(now - prev);
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
  t += dt;

  bass += (bassT - bass) * (bassT > bass ? 0.5 : 0.08);
  bassT *= 0.9;

  const T = t + t0;
  SIG = 10 + Math.sin(T * 0.045 + 1) * 3 * cfg.morph;
  RHO = 28 + Math.sin(T * 0.06) * 3.8 * cfg.morph;
  acc += dt;
  let n = 0;
  while (acc >= TICK && n < 4) { tick(1 + bass * 0.35); acc -= TICK; n++; }
  if (n === 4) acc = 0;

  // caméra : orbite lente + parallaxe souris amortie
  yaw += dt * cfg.autoRotate;
  // écran vertical (téléphone, écran pivoté) : l'attracteur est tourné et la caméra recule pour qu'il tienne en largeur
  const aspect = W / H, portrait = aspect < 0.95;
  const rollFix = cfg.roll >= 0 ? cfg.roll : portrait ? 2.25 : 0;                // les deux ailes l'une au-dessus de l'autre
  // souris : position absolue -> angle (±2 rad sur chaque axe), l'angle reste où on le laisse.
  // La face avant de l'attracteur suit le curseur dans les deux axes (avant, l'axe horizontal était inversé).
  // L'écart au repos est ramené dans le repère de l'image avant sa rotation, pour rester juste sur écran vertical.
  const k = 1 - Math.pow(0.0005, dt);
  const tx = cfg.mouse && !MOBILE ? mxT * cfg.mouseStrength : 0, ty = cfg.mouse && !MOBILE ? myT * cfg.mouseStrength : 0.2;
  mx += (tx - mx) * k; my += (ty - my) * k;
  if (!Number.isFinite(mx) || !Number.isFinite(my)) { mx = tx; my = ty; }
  const ex = mx, ey = my - 0.2, cR = Math.cos(rollFix), sR = Math.sin(rollFix);
  const cam = {
    t: t + t0,
    yaw: yaw + Math.sin(T * 0.11) * 0.5 * cfg.sway - (cR * ex - sR * ey) * 2,
    pitch: Math.sin(T * 0.13) * 0.32 * cfg.sway + 0.4 + (sR * ex + cR * ey) * 2,
    dist: 3.6 + Math.sin(T * 0.09) * 0.45 * cfg.sway - bass * 0.2,
    roll: Math.sin(T * 0.07) * 0.16 * cfg.sway + rollFix,
    focal: 1 / Math.tan((38 * Math.PI / 180) / 2),
  };
  cam.dist *= cfg.zoom > 0 ? cfg.zoom : portrait ? Math.min(2.2, Math.max(1, 0.72 / aspect)) : 1;
  cam.rot = rotation(cam.yaw, cam.pitch, cam.roll);
  if (MOBILE) applyMobile(cam, dt);                      // doigt, gyroscope : rotations dans le repère de l'écran
  if (DEBUG) window.__cam = { rot: Array.from(cam.rot), dist: cam.dist, yaw: cam.yaw, pitch: cam.pitch };

  // 1. scène (traînées 3D + têtes) en HDR, additive, MSAA si possible
  gl.bindFramebuffer(gl.FRAMEBUFFER, ms ? ms.fb : scene.fb);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  const density = Math.sqrt(900 / N) * (HDR ? 1 : 0.5);
  const intensity = 0.13 * density * cfg.brightness * (1 + bass * 0.5);

  gl.useProgram(P_LINE.p); bindCommon(P_LINE.u, cam);
  gl.uniform1f(P_LINE.u.uIntensity, intensity);
  const sub = Math.max(1, Math.min(8, cfg.smooth | 0));
  gl.uniform1i(P_LINE.u.uSub, sub);
  const ribbon = cfg.aa === 1;
  gl.uniform1i(P_LINE.u.uRibbon, ribbon ? 1 : 0);
  gl.uniform2f(P_LINE.u.uRes, W, H);
  gl.uniform1f(P_LINE.u.uWarpGlow, cfg.spdMode ? Math.min(1, Math.abs(Math.log(Math.max(0.05, cfg.spdIn) / Math.max(0.05, cfg.spdOut))) / Math.log(4)) : 0);
  if (ribbon) gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, ((L - 1) * sub + 1) * 2, N);
  else gl.drawArraysInstanced(gl.LINE_STRIP, 0, (L - 1) * sub + 1, N);

  gl.useProgram(P_HEAD.p); bindCommon(P_HEAD.u, cam);
  gl.uniform1f(P_HEAD.u.uHeadSize, Math.max(2, Math.min(W, H) / 260));
  gl.uniform1f(P_HEAD.u.uHeadI, 0.9 * cfg.heads * density * (1 + bass));
  gl.drawArrays(gl.POINTS, 0, N);

  if (ms) {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, ms.fb);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, scene.fb);
    gl.blitFramebuffer(0, 0, W, H, 0, 0, W, H, gl.COLOR_BUFFER_BIT, gl.NEAREST);
    gl.invalidateFramebuffer(gl.READ_FRAMEBUFFER, [gl.COLOR_ATTACHMENT0]);
  }

  // 2. bloom (dual filter : descente puis remontée additive)
  gl.disable(gl.BLEND);
  let src = scene;
  for (const lv of levels) { pass(P_DOWN, lv, src.t, [1 / src.w, 1 / src.h]); src = lv; }
  gl.enable(gl.BLEND);
  for (let i = levels.length - 1; i > 0; i--) pass(P_UP, levels[i - 1], levels[i].t, [1 / levels[i].w, 1 / levels[i].h]);
  gl.disable(gl.BLEND);

  // 3. ciel lointain : une bande du ciel suivant tous les 1/15 s, toutes à un même instant figé ; une fois
  //    complet, il remplace l'actuel en fondu (tout d'un coup après un redimensionnement ou un changement de palette)
  const SKY_STEP = LOWPOWER ? 1 / 6 : 1 / 15;
  skyT += dt;
  if (cfg.nebula > 0 && (skyFull || skyT >= SKY_STEP)) {
    skyT = skyFull ? 0 : Math.min(skyT - SKY_STEP, SKY_STEP);
    skyClear = false;
    if (skyFull) { skyStrip = 0; skyTime = cam.t; }
    else if (skyStrip === 0) skyTime = cam.t;
    const dst = skyFull ? skyCur : skyBuild;
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
    gl.viewport(0, 0, dst.w, dst.h);
    gl.useProgram(P_SKY.p);
    const asp = W / H, por = smooth01(1.3, 0.7, asp);                         // écran vertical : nébuleuses en haut et en bas
    const at = (ux, uy, px, py) => [((ux + (px - ux) * por) - 0.5) * asp, (uy + (py - uy) * por) - 0.5];
    gl.uniform2f(P_SKY.u.uExt, skyExt[0], skyExt[1]);
    gl.uniform2fv(P_SKY.u.uNebA, at(0.17, 0.8, 0.3, 0.88));
    gl.uniform2fv(P_SKY.u.uNebB, at(0.84, 0.2, 0.7, 0.12));
    gl.uniform3fv(P_SKY.u.uTint, skyTint);
    gl.uniform3fv(P_SKY.u.uTint2, skyTint2);
    gl.uniform1f(P_SKY.u.uMono, skyMono);
    gl.uniform1f(P_SKY.u.uTime, skyTime);
    gl.uniform1f(P_SKY.u.uNebula, cfg.nebula);
    gl.enable(gl.SCISSOR_TEST);
    for (let n = skyFull ? SKY_STRIPS : 1; n > 0; n--) {
      const y0 = Math.floor(skyStrip * dst.h / SKY_STRIPS), y1 = Math.floor((skyStrip + 1) * dst.h / SKY_STRIPS);
      gl.scissor(0, y0, dst.w, y1 - y0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      skyStrip++;
    }
    gl.disable(gl.SCISSOR_TEST);
    if (skyFull) {                                         // ciel complet tout de suite, sans fondu
      skyOld = skyCur; skyStrip = 0; skyFull = false;
    } else if (skyStrip >= SKY_STRIPS) {                   // ciel suivant prêt : il devient l'actuel, le fondu repart
      const free = skyOld;
      skyOld = skyCur; skyCur = skyBuild; skyBuild = free === skyCur || free === skyOld ? skyTex.find(x => x !== skyOld && x !== skyCur) : free;
      skyStrip = 0;
    }
  } else if (cfg.nebula <= 0 && !skyClear) {
    skyClear = true;
    gl.clearColor(0, 0, 0, 0);
    for (const x of skyTex) { gl.bindFramebuffer(gl.FRAMEBUFFER, x.fb); gl.clear(gl.COLOR_BUFFER_BIT); }
  }

  // 4. composition finale
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  const u = P_COMP.u;
  gl.useProgram(P_COMP.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.t); gl.uniform1i(u.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, levels[0].t); gl.uniform1i(u.uBloom, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, skyOld.t); gl.uniform1i(u.uSky, 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, skyCur.t); gl.uniform1i(u.uSkyB, 3);
  gl.uniform1f(u.uSkyMix, skyOld === skyCur ? 1 : Math.min(1, (skyStrip + Math.min(1, skyT / SKY_STEP)) / SKY_STRIPS));
  gl.uniform2f(u.uExt, skyExt[0], skyExt[1]);
  gl.uniform1f(u.uPx, 1080 / Math.min(W, H));
  gl.uniform2f(u.uRes, W, H);
  gl.uniform2f(u.uCam, cam.yaw, cam.pitch);
  gl.uniform1f(u.uTime, cam.t);
  gl.uniform1f(u.uBloomI, 0.4 * cfg.bloom * (1 + bass * 1.2));
  gl.uniform1f(u.uExposure, 1.0);
  gl.uniform1f(u.uStars, cfg.stars);
  gl.uniform1f(u.uPulse, bass);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

updatePalette();
resize();
alloc();
reportQuality();
if (Object.keys(savedProps).length) try { window.wallpaperPropertyListener.applyUserProperties(savedProps); } catch (e) { /* réglages illisibles */ }
for (let i = +(qs.get('warm') || 0); i > 0; i--) tick(1);
rafId = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
